<title>이터널 리턴 패치노트</title>
<style>
  :root {
    --bg: #12141a; --panel: #1b1e27; --panel2: #232734; --line: #2e3344;
    --text: #e6e8f0; --dim: #8b91a5; --accent: #e8463c;
    --buff: #4cc38a; --nerf: #ef5a5a; --adjust: #e9b949;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.6 "Malgun Gothic", "Apple SD Gothic Neo", sans-serif; }
  header { position: sticky; top: 0; z-index: 5; background: rgba(18,20,26,.95); backdrop-filter: blur(6px); border-bottom: 1px solid var(--line); }
  .bar { max-width: 1100px; margin: 0 auto; padding: 14px 16px 0; display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: center; }
  .bar h1 { font-size: 18px; margin: 0; flex: 1 1 auto; }
  .bar h1 b { color: var(--accent); }
  select { background: var(--panel2); color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 6px 10px; font: inherit; max-width: 100%; }
  a { color: #7fb2ff; }
  .tabs { max-width: 1100px; margin: 0 auto; padding: 10px 16px 0; display: flex; gap: 4px; }
  .tabs button { background: none; border: 0; border-bottom: 3px solid transparent; color: var(--dim); font: inherit; font-weight: 700; padding: 8px 14px; cursor: pointer; }
  .tabs button.on { color: var(--text); border-bottom-color: var(--accent); }
  .tabs button span { font-weight: 400; font-size: 13px; margin-left: 4px; color: var(--dim); }
  main { max-width: 1100px; margin: 0 auto; padding: 18px 16px 60px; }
  .empty { color: var(--dim); text-align: center; padding: 60px 0; }

  /* 업데이트 */
  .ugroup > h2 { font-size: 16px; margin: 26px 0 10px; padding-left: 10px; border-left: 4px solid var(--accent); }
  .ugroup:first-child > h2 { margin-top: 0; }
  details.card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; margin-bottom: 10px; }
  details.card > summary { cursor: pointer; padding: 12px 16px; font-weight: 700; }
  .card .body { padding: 0 18px 14px; }
  .body img { max-width: 100%; max-height: 240px; width: auto; height: auto; border-radius: 6px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; padding: 0 16px 12px; }
  .chip { background: var(--panel2); border: 1px solid var(--line); border-radius: 14px; padding: 2px 10px; font-size: 13px; }
  .body table { border-collapse: collapse; width: 100%; font-size: 13px; }
  .body td, .body th { border: 1px solid var(--line); padding: 4px 8px; }
  .body strong { color: #ffd479; }
  .body em { color: var(--dim); }

  /* 실험체 / 아이템 */
  .group { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px 16px 16px; margin-bottom: 14px; }
  .group h2 { font-size: 16px; margin: 0 0 12px; }
  .group h2 small { color: var(--dim); font-weight: 400; margin-left: 6px; }
  .group.buff h2 { color: var(--buff); }
  .group.nerf h2 { color: var(--nerf); }
  .group.adjust h2 { color: var(--adjust); }
  .grid { display: flex; flex-wrap: wrap; gap: 8px; }
  .icon { padding: 0; margin: 0; background: var(--panel2); cursor: pointer; border: 2pt solid transparent; border-radius: 6px; overflow: hidden; display: block; }
  .icon.selected { border: 2pt solid rgb(255, 0, 0); }
  .icon img { display: block; }
  .icon.char img { width: 69px; height: 93px; object-fit: cover; }
  .icon.item img { width: 82px; height: 61px; object-fit: contain; }
  .icon .noimg { display: flex; align-items: center; justify-content: center; text-align: center; color: var(--text); font-size: 12px; line-height: 1.3; padding: 4px; }
  .icon.char .noimg { width: 69px; height: 93px; }
  .icon.item .noimg { width: 82px; height: 61px; }
  .grade-Common { background: #3a3d45; } .grade-Uncommon { background: #2d5a3a; } .grade-Rare { background: #2a4a78; }
  .grade-Epic { background: #573479; } .grade-Legend { background: #7a5a1c; } .grade-Mythic { background: #7a2626; }
  .detail { margin-top: 14px; background: var(--panel2); border-radius: 8px; padding: 14px 18px; }
  .detail h3 { margin: 0 0 6px; font-size: 17px; }
  .detail .meta { color: var(--dim); font-size: 13px; margin-bottom: 8px; }
  .detail .desc { color: #c7cbd8; margin: 0 0 8px; }
  .detail ul { margin: 6px 0; padding-left: 22px; }
  .detail strong { color: #ffd479; }
  .detail li[data-s] > p:first-child::after { margin-left: 6px; font-size: 12px; font-weight: 700; }
  .detail li[data-s="buff"] > p:first-child::after { content: "▲ 상향"; color: var(--buff); }
  .detail li[data-s="nerf"] > p:first-child::after { content: "▼ 하향"; color: var(--nerf); }
  .detail li[data-s="adjust"] > p:first-child::after { content: "◆ 엇갈림"; color: var(--adjust); }
  .badge { display: inline-block; font-size: 12px; font-weight: 700; padding: 1px 8px; border-radius: 10px; margin-left: 8px; vertical-align: 2px; color: #111; }
  .badge.buff { background: var(--buff); } .badge.nerf { background: var(--nerf); } .badge.adjust { background: var(--adjust); }
  .hint { color: var(--dim); font-size: 13px; margin: -4px 0 14px; }
  .hint a, footer a { color: var(--dim); }
  footer { max-width: 1100px; margin: 0 auto; padding: 18px 16px 40px; border-top: 1px solid var(--line); color: var(--dim); font-size: 12px; line-height: 1.8; }
  footer p { margin: 0; }
</style>
</head>

window.ER_PATCHES = [{"id":3924,"updated":"2026-10-30T01:31:23.000000Z","html":"\u003cp\u003e\u003cem\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e12.7 업데이트는 10월 29일 목요일 오전 11시부터 오후 3시까지, 약 4시간의 정기 점검을 통해 적용됩니다.\u003c/span\u003e\u003c/em\u003e\u003c/p\u003e\u003ch2\u003e\u003cbr\u003e\u003c/h2\u003e\u003ch5 class=\"er-point-title\"\u003e신규 스킨 및 이모티콘\u003c/h5\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u003cstrong\u003e와일드 웨스트 크레이버 (희귀)\u0026nbsp;\u003c/strong\u003e스킨이 출시됩니다.\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u003cem\u003e“그 멋진 모자는 우리가 가져도 되지? 딱 우리 스타일인데.”\u003c/em\u003e\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cimg src=\"https://cdn.playeternalreturn.com/2026%2F10%2F28%2F1793164810721-%ED%8C%A8%EC%B9%98%EB%85%B8%ED%8A%B8_%ED%81%AC%EB%A0%88%EC%9D%B4%EB%B2%84.png\" class=\"fr-fil fr-dib fr-draggable\" style=\"width: 1000px;\"\u003e\u003c/p\u003e\u003cp\u003e\u003cimg src=\"https://cdn.playeternalreturn.com/2026%2F10%2F28%2F1793164969545-%ED%81%AC%EB%A0%88%EC%9D%B4%EB%B2%84+%EC%8A%A4%ED%82%A8+%EC%86%8C%EA%B0%9C.gif\" class=\"fr-fil fr-dib fr-draggable\"\u003e\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u003cstrong\u003e에이든 알겠다, 안된다, 나의 시대다, ｢에이든｣\u0026nbsp;\u003c/strong\u003e이모티콘이 출시됩니다.\u003c/span\u003e\u003c/p\u003e\u003ch3\u003e\u003cimg src=\"https://cdn.playeternalreturn.com/2026%2F10%2F28%2F1793164833141-%EC%9D%B4%EB%AA%A8%ED%8B%B0%EC%BD%98_%EC%97%90%EC%9D%B4%EB%93%A0.png\" class=\"fr-fil fr-dib fr-draggable\" style=\"box-sizing: border-box; margin: 5px auto 5px 0px; padding: 0px; border: 0px; font-style: normal; font-variant-ligatures: normal; font-variant-caps: normal; font-variant-numeric: inherit; font-variant-east-asian: inherit; font-variant-alternates: inherit; font-variant-position: inherit; font-variant-emoji: inherit; font-weight: 400; font-stretch: inherit; font-size: 16px; line-height: inherit; font-family: sans-serif; font-optical-sizing: inherit; font-size-adjust: inherit; font-kerning: inherit; font-feature-settings: inherit; font-variation-settings: inherit; font-language-override: inherit; vertical-align: top; cursor: pointer; position: relative; max-width: 100%; display: block; float: none; text-align: left; color: rgb(174, 197, 203); letter-spacing: normal; orphans: 2; text-indent: 0px; text-transform: none; widows: 2; word-spacing: 0px; -webkit-text-stroke-width: 0px; white-space: normal; background-color: rgb(14, 14, 15); text-decoration-thickness: initial; text-decoration-style: initial; text-decoration-color: initial;\"\u003e\u003cbr\u003e\u003c/h3\u003e\u003ch3\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u003cstrong\u003e\u003cspan style=\"font-size: 18px;\"\u003e사냥꾼의 솥단지 스킨\u003c/span\u003e\u003c/strong\u003e\u003cbr\u003e\u003c/span\u003e\u003c/h3\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e사냥꾼의 솥단지를 새로운 모습으로 꾸밀 수 있는 솥단지 스킨이 처음으로 출시됩니다. 새로운 솥단지로 루미아 섬에서 팀원들과 따뜻한 음식을 만들어 나눠 보세요!\u003c/span\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e사냥꾼의 솥단지 스킨은 보관함 → 기타 → 인게임 치장에서 설정할 수 있습니다.\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e솥단지 스킨은 솥단지를 설치한 생존자의 설정에 따라 적용됩니다.\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cimg src=\"https://cdn.playeternalreturn.com/2026%2F10%2F28%2F1793164849884-%ED%82%A4%EC%95%84%EB%9D%BC1.gif\" class=\"fr-fil fr-dib fr-draggable\"\u003e\u003c/p\u003e\u003cp\u003e\u003cimg src=\"https://cdn.playeternalreturn.com/2026%2F10%2F28%2F1793164856807-%ED%98%84%EC%9A%B01.gif\" class=\"fr-fil fr-dib fr-draggable\"\u003e\u003c/p\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e※ 솥단지 스킨을 적용해도 솥단지를 통해 획득하는 음식 아이템은 변경되지 않습니다.\u003cbr\u003e※ 자세한 상품 구성은 점검 당일 별도의 상품 공지를 통해 안내 드릴 예정입니다.\u003c/span\u003e\u003c/p\u003e\u003ch2\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u003cspan style=\"font-size: 18px;\"\u003e\u003cbr\u003e\u003c/span\u003e\u003cstrong\u003e\u003cspan style=\"font-size: 18px;\"\u003e랭크 휴면 강등 유예 포인트 조정\u003c/span\u003e\u003c/strong\u003e\u003c/span\u003e\u003c/h2\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e지난 12.6 업데이트에서 안내드린 대로, 랭크 휴면 강등 설문 조사 결과를 바탕으로 티어별 유예 포인트 최대치가 조정됩니다.\u003c/span\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e메테오라이트: 12 (기존과 동일)\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e미스릴: 12 (기존과 동일)\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e데미갓: 12 → \u003cstrong\u003e10\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e이터니티: 12 → \u003cstrong\u003e8\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u003cbr\u003e\u003c/span\u003e\u003c/p\u003e\u003ch3\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u003cstrong\u003e\u003cspan style=\"font-size: 18px;\"\u003e박스/분해/개인 상점 획득 확률 및 구성품 변경 사전 안내\u003c/span\u003e\u003c/strong\u003e\u003c/span\u003e\u003c/h3\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e11월 12일(목) 13.0 업데이트를 통해 박스 및 분해, 개인 상점에서 획득 가능한 구성품과 확률이 변경될 예정입니다.\u003c/span\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e데일리 박스, 시즌 조각팩, 일반 시즌 조각팩, 고급 시즌 조각팩 등 획득 구성품이 일부 변경됩니다.\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e온전한 아이템 분해를 통해 획득하는 토큰 또한 시즌 13 토큰으로 변경됩니다.\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e※ 13.0 업데이트에 적용될 확률 정보는 현재 작업 중이며, 13.0 패치 노트를 통해 상세히 안내 드릴 예정입니다.\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u003cbr\u003e\u003c/span\u003e\u003c/p\u003e\u003ch5 class=\"er-point-title\"\u003e시스템\u003c/h5\u003e\u003ch3\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u003cstrong\u003e\u003cspan style=\"font-size: 18px;\"\u003e시즌 12 론울프 이벤트 모드 종료\u003c/span\u003e\u003c/strong\u003e\u003c/span\u003e\u003c/h3\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e고독한 늑대들의 시간, 론울프 이벤트 모드가 점검 이후 종료됩니다. 참여해주신 분들께 감사드립니다.\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u003cbr\u003e\u003c/span\u003e\u003c/p\u003e\u003ch3\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u003cstrong\u003e\u003cspan style=\"font-size: 18px;\"\u003e갬빗 잠금 처리\u003c/span\u003e\u003c/strong\u003e\u003c/span\u003e\u003c/h3\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e12.7 업데이트부터 갬빗 콘텐츠를 이용할 수 없습니다.\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e콘텐츠 재해금 시점은 추후 별도의 패치노트에서 안내될 예정입니다.\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u003cbr\u003e\u003c/span\u003e\u003c/p\u003e\u003ch3\u003e\u003cspan style=\"color: rgb(255, 255, 255); font-size: 18px;\"\u003e\u003cstrong\u003e이스포츠 스케쥴러 개선\u003c/strong\u003e\u003c/span\u003e\u003c/h3\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e대회 일정과 결과를 더 편하게 확인할 수 있도록 이스포츠 스케쥴러가 개선됩니다.\u003c/span\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e라이브로 진행 중인 대회가 있으면 이스포츠 스케쥴러 메뉴 버튼에 표시가 추가됩니다.\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e대회 일정 탭에서 마우스 드래그로 대회 슬롯을 넘겨 볼 수 있습니다.\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e대회 일정 탭에 현재 시즌과 직전 시즌 대회가 함께 표시되며, 각 시즌의 첫 번째 대회에 시즌 시작 플래그가 표시됩니다.\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e결과를 확인하지 않은 대회 슬롯은 마우스 오버가 아닌 클릭으로 결과를 확인하도록 변경됩니다.\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e결과를 확인한 대회 슬롯에 하이라이트 영상이 등록되어 있으면 하이라이트 영상으로 바로 이동할 수 있습니다.\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u003cbr\u003e\u003c/span\u003e\u003c/p\u003e\u003ch3\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u003cstrong\u003e\u003cspan style=\"font-size: 18px;\"\u003e매치메이킹 개선\u003c/span\u003e\u003c/strong\u003e\u003c/span\u003e\u003c/h3\u003e\u003cul\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e아시아: 상위권 큐가 세분화되며, 최상위 큐는 8,800점 이상으로 제한됩니다.\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u003cbr\u003e\u003c/span\u003e\u003c/p\u003e\u003ch5 class=\"er-point-title\"\u003e전술 스킬\u003c/h5\u003e\u003cul\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u0026nbsp;진실의 칼날\u003c/span\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e쿨다운 10/8초 → \u003cstrong\u003e9/7초\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u0026nbsp;\u003c/span\u003e\u003c/p\u003e\u003ch5 class=\"er-point-title\"\u003e실험체\u003c/h5\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u003cstrong\u003e나타폰\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e나타폰은 적에게 충분히 위협적인 피해를 입히지 못하고 있습니다. \u003cstrong\u003eQ - 스냅샷\u003c/strong\u003e의 피해량을 강화하여 교전 시 보다 유의미한 화력을 발휘할 수 있도록 상향 조정합니다.\u003c/span\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e스냅샷(Q)\u003c/span\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e피해량 60/100/140/180/220(+스킬 증폭의 80%) → 60/100/140/180/220\u003cstrong\u003e(+스킬 증폭의 85%)\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u0026nbsp;\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u003cstrong\u003e레니\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e레니는 아직 방어적인 아이템 세팅을 자주 활용하는 모습을 보이고 있습니다. 이에\u003cstrong\u003e\u0026nbsp;W - 뿅! 망치\u003c/strong\u003e와 \u003cstrong\u003eE - 에어 호른! 건\u003c/strong\u003e의 기본 수치를 낮추고 스킬 증폭 계수를 상향하여 스킬 증폭 아이템 세팅의 중요도를 더욱 높입니다.\u003c/span\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e뿅! 망치(W)\u003c/span\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e이동 속도 증가 12/14/16/18/20%(+스킬 증폭의 2.5%) → \u003cstrong\u003e7/9/11/13/15%(+스킬 증폭의 3.5%)\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e에어 호른! 건(E)\u003c/span\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e보호막량 50/65/80/95/110(+레니 레벨*3)(+스킬 증폭의 25%) → 50/65/80/95/110\u003cstrong\u003e(+레니 레벨*2)(+스킬 증폭의 30%)\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u0026nbsp;\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u003cstrong\u003e루치아\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e루치아는 기동 능력이 보강된 이후 현재 높은 선택률과 함께 우수한 지표를 기록하고 있습니다. 이에 \u003cstrong\u003eEQ - 찬란한 낭만\u003c/strong\u003e의 피해량을 하향하여 피해 능력은 일부 견제하고자 합니다.\u003c/span\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e화려한 낭만 / 찬란한 낭만(Q)\u003c/span\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e찬란한 낭만(EQ) 피해량 80/115/150/185/220(+스킬 증폭의 80%) → 80/115/150/185/220\u003cstrong\u003e(+스킬 증폭의 75%)\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u0026nbsp;\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u003cstrong\u003e리오\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e리오는 최상위권 게임에서 뛰어난 안정성을 보이며 활약하고 있습니다. 기본 체력을 낮춰 생존 능력을 하향 조정합니다.\u003c/span\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e기본 체력 930 → \u003cstrong\u003e900\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u0026nbsp;\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u003cstrong\u003e마커스\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e마커스는 최상위권 게임에서 꾸준히 강세를 띠고 있습니다. 주력 스킬인 \u003cstrong\u003eQ - 전투 교범\u003c/strong\u003e의 피해량을 하향하여 과도하게 높은 전투 능력을 적정 수준으로 낮춥니다.\u003c/span\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e전투 교범(Q)\u003c/span\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e피해량 10/20/30/40/50(+추가 체력의 18%) → 10/20/30/40/50\u003cstrong\u003e(+추가 체력의 16%)\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u0026nbsp;\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u003cstrong\u003e바냐\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e바냐는 최근 낮은 내구도 지표와 함께 교전에서 다소 아쉬운 모습을 보이고 있습니다. \u003cstrong\u003eP - 몽환 나비\u003c/strong\u003e의 기본 보호막량을 상향하여 부족한 생존력을 보완하고 전투 유지력을 한층 끌어올립니다.\u003c/span\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e몽환 나비(P)\u003c/span\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e보호막량 30/60/90(+스킬 증폭의 30%) → \u003cstrong\u003e40/75/110\u003c/strong\u003e(+스킬 증폭의 30%)\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u0026nbsp;\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u003cstrong\u003e버니스\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e버니스는 다소 아쉬운 피해량 지표를 기록하고 있습니다. 기본 공격력을 상향하여 전반적인 화력을 직관적으로 보완합니다.\u003c/span\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e기본 공격력 37 → \u003cstrong\u003e40\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u0026nbsp;\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u003cstrong\u003e블레어\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e블레어는 전반적인 통계가 뛰어나며, 특히 매우 높은 피해량 지표를 기록하고 있습니다. 쌍검 형태의 \u003cstrong\u003eQ - 이중 참격\u0026nbsp;\u003c/strong\u003e2타 피해량을 낮춰 위력을 하향 조정합니다.\u003c/span\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e이중 참격 / 이중 휩쓸기(Q)\u003c/span\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e이중 참격(쌍검 Q) 2타 피해량 20/50/80/110/140(+추가 공격력의 90/100/110/120/130%) → \u003cstrong\u003e10/40/70/100/130(+추가 공격력의 80/90/100/110/120%)\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u0026nbsp;\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u003cstrong\u003e슈린\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e슈린의 \u003cstrong\u003eW - 무진검결\u003c/strong\u003e은 높은 적중 난이도에 비해 적중 시 보상이 다소 낮은 편입니다. 기절 지속 시간을 늘려 스킬 적중에 성공했을 때 얻을 수 있는 이점을 높입니다.\u003c/span\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e무진검결(W)\u003c/span\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e기절 지속 시간 1초 → \u003cstrong\u003e1.2초\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u0026nbsp;\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u003cstrong\u003e아델라\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e방망이 아델라는 꾸준히 높은 지표를 기록하고 있습니다. 무기 숙련도의 레벨 당 스킬 증폭 효과를 낮춰 화력을 덜어냅니다.\u003c/span\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e방망이 무기 숙련도 레벨 당 스킬 증폭 4.6% →\u003cstrong\u003e\u0026nbsp;4.5%\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u0026nbsp;\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u003cstrong\u003e아르다\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e아르다는 플레이 환경과 조합에 따라 성능의 편차가 크게 나타나고 있습니다. \u003cstrong\u003eP - 유물 탐구\u003c/strong\u003e의 체력 회복량을 상향하여 부족한 교전 능력을 보완하되, \u003cstrong\u003eRE - 님루드의 문\u003c/strong\u003e 지속 시간은 단축하여 비석이 장시간 남아 상대에게 과도한 압박을 주던 문제를 개선합니다.\u003c/span\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e유물 탐구(P)\u003c/span\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e체력 회복량 50/85/120(+스킬 증폭의 10%) → 50/85/120\u003cstrong\u003e(+스킬 증폭의 12%)\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e잠들어있는 힘(R)\u003c/span\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e님루드의 문(RE) 지속 시간 5초 → \u003cstrong\u003e4초\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u0026nbsp;\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u003cstrong\u003e아비게일\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e아비게일은 대부분의 지표에서 약세를 보이고 있습니다. \u003cstrong\u003eE - 워프 슬래시\u003c/strong\u003e의 고레벨 구간 피해량을 상향 조정하여, 게임 후반부 교전에서 더욱 강력한 성능을 발휘할 수 있도록 힘을 더합니다.\u003c/span\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e워프 슬래시(E)\u003c/span\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e피해량 70/85/100/115/130(+스킬 증폭의 40%) → 70/\u003cstrong\u003e95/120/145/170\u003c/strong\u003e(+스킬 증폭의 40%)\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u0026nbsp;\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u003cstrong\u003e아야\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e돌격 소총 아야는 대부분의 구간에서 낮은 지표를 기록하고 있습니다. 무기 숙련도 효과를 강화하여 전반적인 화력을 상향 조정합니다.\u003c/span\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e돌격 소총 무기 숙련도 레벨 당 기본 공격 증폭 1.4% → \u003cstrong\u003e1.5%\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u0026nbsp;\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u003cstrong\u003e에스텔\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e에스텔은 전반적인 통계가 평균을 밑돌고 있으며, 특히 에스텔에게 기대되는 생존 및 아군 보호 능력이 다소 부족한 모습입니다. \u003cstrong\u003eR - 헬기호출\u003c/strong\u003e의 보호막량을 상향하여 본인의 생존력과 아군 지원 능력을 한층 강화합니다.\u003c/span\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e헬기호출(R)\u003c/span\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e자신에게 사용 시 보호막량 100/150/200(+스킬 증폭의 55%)(+잃은 체력의 20%) → 100/150/200(+스킬 증폭의 55%)\u003cstrong\u003e(+잃은 체력의 25%)\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e아군에게 사용 시 보호막량 100/200/300(+스킬 증폭의 55%)(+대상 잃은 체력의 15%) → \u003cstrong\u003e150/250/350\u003c/strong\u003e(+스킬 증폭의 55%)(+대상 잃은 체력의 15%)\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u0026nbsp;\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u003cstrong\u003e엘레나\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e엘레나는 상승한 화력과 함께 준수한 내구도까지 갖추어 교전에서 높은 영향력을 발휘하고 있습니다. 진입했을 때의 위력은 보존하되, 상대도 대응할 수 있는 여지를 갖도록 레벨 당 방어력을 소폭 낮춰 리스크를 더합니다.\u003c/span\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e레벨 당 방어력 3.3 → \u003cstrong\u003e3.2\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u0026nbsp;\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u003cstrong\u003e이안\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e이안은 뛰어난 교전 능력을 바탕으로 높은 승률과 점수 획득량을 유지하고 있습니다. 레벨 당 체력을 낮춰 교전 시의 내구도를 견제합니다.\u003c/span\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e레벨 당 체력 91 → \u003cstrong\u003e88\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u0026nbsp;\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u003cstrong\u003e일레븐\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u003cstrong\u003eW - 자~ 집중!\u003c/strong\u003e의 도발 지속 시간을 늘려 일레븐의 다소 부족했던 군중 제어 능력을 보완하고 교전 성능을 높입니다.\u003c/span\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e자~ 집중!(W)\u003c/span\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e최소 도발 지속 시간 0.4/0.5/0.6/0.7/0.8 → \u003cstrong\u003e0.5/0.6/0.7/0.8/0.9초\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e최대 도발 지속 시간 0.8/1/1.2/1.4/1.6초 → \u003cstrong\u003e1/1.2/1.4/1.6/1.8초\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u0026nbsp;\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u003cstrong\u003e츠바메\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u003cstrong\u003eW - 제비걸음\u003c/strong\u003e의 공격 속도 증가량을 한 차례 더 상향하여 츠바메의 화력을 보강합니다.\u003c/span\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e제비걸음(W)\u003c/span\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e공격 속도 증가 20/25/30/35/40% → \u003cstrong\u003e25/30/35/40/45%\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u0026nbsp;\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u003cstrong\u003e카티야\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e카티야는 매우 높은 선택률과 함께 뛰어난 피해량을 기록하고 있습니다. 저격총 무기 숙련도 효과를 낮춰 전반적인 위력을 하향 조정합니다.\u003c/span\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e저격총 무기 숙련도 레벨 당 기본 공격 증폭 2% → \u003cstrong\u003e1.9%\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u0026nbsp;\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u003cstrong\u003e크레이버\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e크레이버는 자체 교전 능력이 부족한 모습을 보이고 있습니다.\u003cstrong\u003e\u0026nbsp;마탄 W - 백플립\u003c/strong\u003e 피해량을 상향하고 \u003cstrong\u003eE - 컴뱃 롤\u003c/strong\u003e의 적중 시 쿨다운 감소율을 늘려 교전 성능을 보완합니다.\u003c/span\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e스윕 킥 / 백플립(W)\u003c/span\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e백플립(마탄W) 피해량 130/160/190/220/250(+스킬 증폭의 85%) → 130/160/190/220/250\u003cstrong\u003e(+스킬 증폭의 90%)\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e컴뱃 롤 / 퀵 스텝(E)\u003c/span\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e컴뱃 롤\u003c/span\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e적 실험체 적중 시 쿨다운 감소 20% → \u003cstrong\u003e25%\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003c/li\u003e\u003c/ul\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u0026nbsp;\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u003cstrong\u003e타지아\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e타지아는 보호막 흡수량 상향 이후 교전 안정성이 확보되며 뛰어난 통계 지표를 기록하고 있습니다. 암기 무기 숙련도 효과를 낮춰 전반적인 위력을 하향 조정합니다.\u003c/span\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e암기 무기 숙련도 레벨 당 스킬 증폭 4.5% → \u003cstrong\u003e4.4%\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u0026nbsp;\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u003cstrong\u003e피오라\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e창 피오라는 피해 능력과 내구도 지표 모두 뛰어난 수치를 기록하며 높은 점수 획득량을 보이고 있습니다. 창 무기 숙련도 효과를 낮춰 교전에서 발휘되는 과도한 성능을 하향 조정합니다.\u003c/span\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e창 무기 숙련도 레벨 당 스킬 증폭 5% → \u003cstrong\u003e4.8%\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u0026nbsp;\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u003cstrong\u003e헤이즈\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e헤이즈는 지속적인 약세를 보이며 낮은 지표를 기록하고 있습니다. \u003cstrong\u003eRQ - 엑셀러레이션 로켓\u003c/strong\u003e의 피해량을 상향하여 원거리 대치 상황에서의 견제력을 보완하고 교전 경쟁력을 가질 수 있도록 돕습니다.\u003c/span\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e40mm 유탄(Q)\u003c/span\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e엑셀러레이션 로켓(RQ) 피해량 80/110/140/170/200(+스킬 증폭의 40%) → \u003cstrong\u003e100/130/160/190/220\u003c/strong\u003e(+스킬 증폭의 40%)\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u0026nbsp;\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u003cstrong\u003e헨리\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e헨리는 뛰어난 안정성을 바탕으로 폭넓은 역할을 수행하며 우수한 통계를 유지하고 있습니다. 레벨 당 체력을 하향하여 적과 직접 마주하는 상황에서의 리스크를 한층 높입니다.\u003c/span\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e레벨 당 체력 78 → \u003cstrong\u003e75\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u0026nbsp;\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u003cstrong\u003e현우\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u003cstrong\u003eQ - 발 밟기\u003c/strong\u003e와 \u003cstrong\u003eR - 핵펀치\u003c/strong\u003e의 추가 공격력 계수를 상향하여, 글러브 현우의 지나치게 낮은 스킬 효율을 일부 개선합니다.\u003c/span\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e발 밟기(Q)\u003c/span\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e피해량 90/130/170/210/250(+추가 공격력의 60%)(+스킬 증폭의 85%) → 90/130/170/210/250\u003cstrong\u003e(+추가 공격력의 90%)\u003c/strong\u003e(+스킬 증폭의 85%)\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e핵펀치(R)\u003c/span\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e최소 피해량 100/140/180(+추가 공격력의 35%)(+스킬 증폭의 75%) → 100/140/180\u003cstrong\u003e(+추가 공격력의 50%)\u003c/strong\u003e(+스킬 증폭의 75%)\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e최대 피해량 300/420/540(+추가 공격력의 105%)(+스킬 증폭의 225%) → 300/420/540\u003cstrong\u003e(+추가 공격력의 150%)\u003c/strong\u003e(+스킬 증폭의 225%)\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u0026nbsp;\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u003cstrong\u003e히스이\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e높은 적중 난이도를 지닌 \u003cstrong\u003eW2 - 일섬\u003c/strong\u003e의 에어본 지속 시간을 늘려 적중에 성공했을 때 보다 높은 리턴을 확보할 수 있게 합니다.\u003c/span\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e거합일섬(W)\u003c/span\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e일섬(W2)\u003c/span\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e에어본 지속 시간 0.5초 →\u003cstrong\u003e\u0026nbsp;0.6초\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003c/li\u003e\u003c/ul\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u003cbr\u003e\u003c/span\u003e\u003c/p\u003e\u003ch5 class=\"er-point-title\"\u003e방어구\u003c/h5\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u003cstrong\u003e옷\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e이단심판관\u003c/span\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e차원 균열 - [고유 지속 효과]\u003c/span\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e피해량 12(+스킬 증폭의 4%) → 12\u003cstrong\u003e(+스킬 증폭의 5%)\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003c/li\u003e\u003c/ul\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u0026nbsp;\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u003cstrong\u003e팔/장식\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e서슬가시 체인 방어 관통 12 → \u003cstrong\u003e13\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u003cbr\u003e\u003c/span\u003e\u003c/p\u003e\u003ch5 class=\"er-point-title\"\u003e코발트 프로토콜\u003c/h5\u003e\u003ch3\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u003cstrong\u003e\u003cspan style=\"font-size: 18px;\"\u003e코발트 프로토콜 모드 보정\u003c/span\u003e\u003c/strong\u003e\u003c/span\u003e\u003c/h3\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u003cstrong\u003e루치아\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e저격총 사용 시 받는 피해량 103% → \u003cstrong\u003e105%\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u003cstrong\u003e블레어\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e쌍검 사용 시 입히는 피해량 104% → \u003cstrong\u003e105%\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u003cbr\u003e\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u003cstrong\u003e세레스\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e양손검 사용 시 입히는 피해량 103% → \u003cstrong\u003e100%\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u003cbr\u003e\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u003cstrong\u003e유키\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e쌍검 사용 시 입히는 피해량 97% → \u003cstrong\u003e100%\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u003cbr\u003e\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u003cstrong\u003e츠바메\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e암기 사용 시 입히는 피해량 94% → \u003cstrong\u003e96%\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u003cbr\u003e\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u003cstrong\u003e펠릭스\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e창 사용 시 입히는 피해량 97% → \u003cstrong\u003e100%\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u003cbr\u003e\u003c/span\u003e\u003c/p\u003e\u003ch5 class=\"er-point-title\"\u003e버그 수정 및 개선 사항\u003c/h5\u003e\u003ch3\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u003cstrong\u003e\u003cspan style=\"font-size: 18px;\"\u003e게임 플레이 개선 사항\u003c/span\u003e\u003c/strong\u003e\u003c/span\u003e\u003c/h3\u003e\u003cul\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e설정 → 게임 → 세부 설정에 [인벤토리 우클릭으로 제작창 열기] 옵션이 추가되어, 인벤토리 아이템 우클릭 시 제작창이 열리지 않도록 설정 가능\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e하이퍼루프 창에서 지역 별 생존자 수 핑 사용 시, 적이 없는 지역은 시스템 채팅에 기본 채팅 색상으로 표시되도록 개선\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e연속 다운 사운드가 다운시킨 본인에게만 출력되고 아군이 다운시킨 경우에는 단일 사운드로 출력되도록 변경하고, 연속 다운 사운드 리소스 개선\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e그래픽 옵션 추천 설정 단계(낮음, 보통, 높음)에 따라 캐릭터 등장 연출과 승리 연출의 그래픽 품질이 차등 적용되도록 개선\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e특정 상황에 아이템 스킬 초집중 중첩이 감소하지 않는 문제 수정\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e아이템 스킬 연장 총열 쿨다운이 기본 공격 모션 종료 시 및 적중 시 각각 적용되는 문제 수정\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e아이템 스킬 전자기 충격이 쿨다운 상태에서 충전 중첩을 획득할 수 있는 문제 수정\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003eB0-r1 (보리)의 페이즈 별 스폰 시간이 의도와 다르게 적용되는 문제 수정\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e인게임에서 키오스크 구매 보조 기능을 활성화해도 적용되지 않는 문제 수정\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e연습 모드 실험체 \u0026amp; 스킨 변경 목록에서 우측 UI 일부가 누락되어 출력되는 문제 수정\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e탐색 목표 아이템 신호 시 목표 아이템과 제작 아이템이 서로 바뀌어 출력되는 문제 수정\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e아이템 제작창(B)에서 동물 지도 탭으로 변경 시 야생 동물과 맵 정보 필터가 겹쳐지는 문제 수정\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e특정 상황에서 야생동물 처치 시 사망 모션이 정상적으로 출력되지 않는 문제 수정\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e아군에게 필요 아이템 요청 시 사운드가 출력되지 않는 문제 수정\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e좌측 상단 대상 정보 UI의 배틀 스코어에 마우스 오버 시 툴팁이 잘못 출력되는 문제 수정\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e루트 파밍 안내 화살표 이펙트 정렬이 잘못 적용되는 문제 수정\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e변이 야생동물 생성 시 빨간 선 이펙트가 출력되는 문제 수정\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e인게임 채팅 입력 중 커서 초기 위치가 이동하는 문제 수정\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e코발트 프로토콜 리플레이 타임라인 이동 시 증폭장치 점령 상태가 동기화되지 않는 문제 수정\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u003cbr\u003e\u003c/span\u003e\u003c/p\u003e\u003ch3\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u003cstrong\u003e\u003cspan style=\"font-size: 18px;\"\u003e실험체 및 무기 개선 사항\u003c/span\u003e\u003c/strong\u003e\u003c/span\u003e\u003c/h3\u003e\u003cul\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e창 무기 스킬 그림자 찌르기(D) 최대 사거리에서 적중 시 에어본이 적용되지 않는 문제 수정\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e단검 무기 스킬 망토와 단검(D) 사용 시 기존 공격 명령이 취소되는 문제 수정\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e특정 상황에서 저격총 무기 스킬 저격(D) 취소 시 인디케이터가 사라지지 않는 문제의 의심 코드 수정\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e스파클링 트윈즈 \u003cstrong\u003e데비\u0026amp;마를렌\u003c/strong\u003e 스킨 착용 중 특정 상황에 마를렌 머리카락이 어색하게 출력되는 문제 수정\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e바다의 화가 \u003cstrong\u003e띠아\u003c/strong\u003e 스킨 로비 애니메이션에서 다람쥐 이펙트가 출력되지 않는 문제 수정\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u003cstrong\u003e마커스\u003c/strong\u003e 사망 상태에서 적에게 충격 부여 시 일격(P) 표시 이펙트가 사라지지 않는 문제 수정\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e특정 상황에 \u003cstrong\u003e세레스\u003c/strong\u003e 빛에게 바치는 맹세(R) 외형 효과가 해제되지 않는 문제 수정\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u003cstrong\u003e세레스\u003c/strong\u003e 쇄도(Q1) 사용 중 이동이 중지된 경우 애니메이션이 어색하게 출력되는 문제 수정\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e퀸 \u003cstrong\u003e실비아\u003c/strong\u003e 바이크에 페르소나 얼굴 외형이 출력되지 않는 문제 수정\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e포커페이스 바니 \u003cstrong\u003e아비게일\u003c/strong\u003e 스킨 착용 중 디멘션 스트라이크(R) 스킬 이펙트가 어색하게 출력되는 문제 수정\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u003cstrong\u003e아야\u003c/strong\u003e 일부 스킨 로비 애니메이션이 어색하게 출력되는 문제 수정\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e이단심판관 \u003cstrong\u003e에키온\u003c/strong\u003e 로비 애니메이션에서 대기 상태일 때 VF의수 이펙트가 출력되는 문제 수정\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u003cstrong\u003e에키온\u003c/strong\u003e 기본 공격 시 궤적 이펙트가 적 시점에 잘못된 색상으로 출력되는 문제 수정\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u003cstrong\u003e유키\u003c/strong\u003e 일부 스킨 로비 애니메이션이 어색하게 출력되는 문제 수정\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e집사 \u003cstrong\u003e이슈트반\u003c/strong\u003e 스킨 로비 애니메이션 대기 상태에서 무기에 고리 이펙트가 출력되지 않는 문제 수정\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u003cstrong\u003e제니\u0026nbsp;\u003c/strong\u003e스포트라이트(Q) 스킬 장판 이펙트가 출력되지 않는 문제 수정\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u003cstrong\u003e케네스\u003c/strong\u003e 억압된 분노(P) 툴팁에서 피해량이 실제 피해량과 다르게 출력되는 문제 수정\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u003cstrong\u003e크레이버\u003c/strong\u003e 아군 소생 효과음이 출력되지 않는 문제 수정\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u003cstrong\u003e크레이버\u0026nbsp;\u003c/strong\u003e데스페라도(P) 마탄 활성화 상태일 때 테두리가 잘못 출력되는 문제 수정\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e하우스키퍼 \u003cstrong\u003e피오라\u003c/strong\u003e 스킨 로비 애니메이션이 어색하게 출력되는 문제 수정\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u003cstrong\u003e하트\u0026nbsp;\u003c/strong\u003e일부 스킨 로비 애니메이션 중 손 모델링이 기타와 겹치는 문제 수정\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u003cstrong\u003e헤이즈\u0026nbsp;\u003c/strong\u003e기본 스킨 착용 중 엑셀러레이션 로켓(RQ) 적중 대상 후방 범위 이펙트가 출력되지 않는 문제 수정\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u003cbr\u003e\u003c/span\u003e\u003c/p\u003e\u003ch3\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u003cstrong\u003e\u003cspan style=\"font-size: 18px;\"\u003e로비 개선 사항\u003c/span\u003e\u003c/strong\u003e\u003c/span\u003e\u003c/h3\u003e\u003cul\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e유저 차단으로 친구 관계가 해제된 경우에도 상대방의 친구 목록에 즉시 반영되도록 개선\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e보관함 → 기타의 드론, 카메라, 사냥꾼의 솥단지, 어나운스, 팀 슬롯 배경, 킬 어나운스 스킨 기본 아이템 이름을 \"기본\"으로 변경\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e특정 상황에서 게임 종료 후 RP 및 전적이 정상적으로 반영되지 않는 문제 수정\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e출석부 화면에서 매칭 성공 시 전략맵 화면으로 넘어가지 않는 문제 수정\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e특정 상황에서 선택한 모드와 다른 모드로 게임이 진행되는 문제 수정\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e시즌12 GC 부산 스텔라 팀 슬롯 배경의 해상도가 낮게 출력되는 문제 수정\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e시즌12 대구 가디언즈 이모티콘의 일부분이 누락되어 출력되는 문제 수정\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e박스에서 아이템 획득 시 현재 보유 중인 아이템 수로 표시되는 문제 수정\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e보름달 올클리어 박스에 남은 기간이 출력되지 않는 문제 수정\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e로비 재진입 시 미션의 완료 알림 표시가 사라지는 문제 수정\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e프로필 설정 아이콘 페이지에서 좌측 UI 일부가 누락되어 출력되는 문제 수정\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e특정 상황에서 ER 패스 시즌 활성화 시 에러 팝업이 출력되는 문제 수정\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e일부 해상도에서 퀘스트 북 구매 팝업 화면이 어색하게 출력되는 문제 수정\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e기초 가이드 팀 전투 내용 중 일반 대전 부활 규칙이 누락된 문제 수정\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e루트 스킬 빌드 설명에 마우스 스크롤이 적용되지 않는 문제 수정\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e루트 스킬 빌드 설명에 문자 수 제한이 적용되지 않는 문제 수정\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e루트 스킬 빌드 설명 여섯 번째 줄에 입력된 텍스트 클릭 시 텍스트 커서가 활성화 되지 않는 문제 수정\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e루트 설명에 띄어쓰기 입력 시 문자 수가 집계되지 않는 문제 수정\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e루트 설명 작성 시 줄바꿈 개수 제한이 정상적으로 적용되지 않는 문제 수정\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e와일드카드 필터 설정이 초기화되지 않는 문제 수정\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e보관함 인게임 치장 아이템 미리보기가 실제보다 어둡게 출력되는 문제 수정\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\n            \u003c/div\u003e","date":"2026-10-28T08:00:00.000000Z","thumb":"https://cdn.playeternalreturn.com/upload/2026/10/28/2jcAUaT1rsWZhqaSTGyyzFaJ92CnfIKZ35BNk1ay.png","title":"2026.10.29 - 12.7 패치노트","url":"https://playeternalreturn.com/posts/news/3924"},{"id":3898,"updated":"2026-10-30T01:30:50.000000Z","html":"\u003cp\u003e\u003cem\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e12.6 업데이트는 10월 15일 목요일 오전 11시부터 오후 3시까지, 약 4시간의 정기 점검을 통해 적용됩니다.\u003c/span\u003e\u003c/em\u003e\u003c/p\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u003cbr\u003e\u003c/span\u003e\u003c/p\u003e\u003ch5 class=\"er-point-title\"\u003e신규 스킨 및 이모티콘\u003c/h5\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u003cstrong\u003e미스틱 퓨어 바니 수아 (영웅)\u0026nbsp;\u003c/strong\u003e스킨이 출시됩니다.\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u003cstrong\u003e미스틱 퓨어 바니 수아\u003c/strong\u003e는 제작소 → 교환소에 출시되며 세일링(Sailing) 토큰으로 교환 가능합니다.\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u003cem\u003e“정의의☆이름으로, 용서하지 않을 거예요! ...라고, 예전에 책에서 봤어요.” \u0026nbsp;\u003c/em\u003e\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u003cimg src=\"https://cdn.playeternalreturn.com/2026%2F10%2F14%2F1791957120428-01.+%ED%8C%A8%EC%B9%98%EB%85%B8%ED%8A%B8_%EC%88%98%EC%95%84.png\" class=\"fr-fil fr-dib fr-draggable\" style=\"width: 1000px;\"\u003e\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cimg src=\"https://cdn.playeternalreturn.com/2026%2F10%2F14%2F1791957129896-02.+%EC%88%98%EC%95%84+%EC%8A%A4%ED%82%A8+%EC%86%8C%EA%B0%9C.gif\" class=\"fr-fil fr-dib fr-draggable\"\u003e\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e10월 20일(화) \u003cstrong\u003e이단심판관 에키온 (희귀)\u0026nbsp;\u003c/strong\u003e스킨이 출시됩니다.\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u003cem\u003e“마음대로 지껄여! 나는 내가, 그 사람이 믿는 길을 갈 뿐이니까...!”\u003c/em\u003e\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u003cimg src=\"https://cdn.playeternalreturn.com/2026%2F10%2F14%2F1791957136336-03.+%ED%8C%A8%EC%B9%98%EB%85%B8%ED%8A%B8_%EC%97%90%ED%82%A4%EC%98%A8.png\" class=\"fr-fil fr-dib fr-draggable\" style=\"width: 1000px;\"\u003e\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u003cbr\u003e\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cimg src=\"https://cdn.playeternalreturn.com/2026%2F10%2F14%2F1791957146714-04.+%EC%9D%B4%EB%8B%A8+%EC%97%90%ED%82%A4%EC%98%A8+%EC%86%8C%EA%B0%9C.gif\" class=\"fr-fil fr-dib fr-draggable\"\u003e\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e10월 20일(화) \u003cstrong\u003e뒷골목 에키온 (고급)\u0026nbsp;\u003c/strong\u003e스킨이 대표 이미지 및 모델링 교체 후 출시됩니다.\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u003cem\u003e“애원해도 소용없어, 보내줄 생각이 없거든.”\u003c/em\u003e\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u003cimg src=\"https://cdn.playeternalreturn.com/2026%2F10%2F14%2F1791957153134-05.+%ED%8C%A8%EC%B9%98%EB%85%B8%ED%8A%B8_%EC%97%90%ED%82%A4%EC%98%A8_2.png\" class=\"fr-fil fr-dib fr-draggable\" style=\"width: 1000px;\"\u003e\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cimg src=\"https://cdn.playeternalreturn.com/2026%2F10%2F14%2F1791957162310-06.+%EB%92%B7%EA%B3%A8%EB%AA%A9+%EC%97%90%ED%82%A4%EC%98%A8+%EC%86%8C%EA%B0%9C.gif\" class=\"fr-fil fr-dib fr-draggable\"\u003e\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u003cstrong\u003e마이 좋아요!, 그 옷 손봐드릴게요, 고.. 고마워요, 으아악 이건 아니야!\u0026nbsp;\u003c/strong\u003e이모티콘이 출시됩니다.\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u003cimg src=\"https://cdn.playeternalreturn.com/2026%2F10%2F14%2F1791957169301-07.+%EC%9D%B4%EB%AA%A8%ED%8B%B0%EC%BD%98_%EB%A7%88%EC%9D%B4.png\" class=\"fr-fil fr-dib fr-draggable\"\u003e\u003c/span\u003e\u003c/p\u003e\u003ch3\u003e\u003cbr\u003e\u003c/h3\u003e\u003ch3\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u003cstrong\u003e\u003cspan style=\"font-size: 18px;\"\u003e세일링 토큰 교환소 추가 상품\u003c/span\u003e\u003c/strong\u003e\u003c/span\u003e\u003c/h3\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e인기 스킨을 세일링 토큰으로 다시 만나볼 수 있도록, 교환소에 스킨 2종과 퀘스트 북이 추가됩니다.\u003c/span\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e기간: 10월 15일(목) 점검 후 ~ 10월 29일(목) 점검 전까지\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e추가 상품\u003c/span\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u003cstrong\u003e트로피컬 디멘션 아비게일\u003c/strong\u003e 스킨\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u003cstrong\u003eMk.VIII Destroyer M.A.G\u003c/strong\u003e 스킨\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u003cstrong\u003e트로피컬 디멘션 아비게일 퀘스트 북\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u003cem\u003e※ 트로피컬 디멘션 아비게일 퀘스트 북의 구성품 중 현 시즌에 이용이 불가능한 이전 시즌 토큰은 시즌 조각팩 3개로 교체될 예정입니다. 이미 구매하신 퀘스트 북에도 적용될 예정으로 퀘스트 북 이용에 참고 부탁드립니다.\u003c/em\u003e\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u003cbr\u003e\u003c/span\u003e\u003c/p\u003e\u003ch5 class=\"er-point-title\"\u003e12.7 랭크 휴면 강등 유예 포인트 조정 사전 안내\u003c/h5\u003e\u003ch4\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u003cstrong\u003e\u003cspan style=\"font-size: 18px;\"\u003e주요 설문 지표 공유\u003c/span\u003e\u003c/strong\u003e\u003c/span\u003e\u003c/h4\u003e\u003cul\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e지난 9월 초 진행된 랭크 유예 포인트에 대한 조사 결과와 이에 따른 조정 방향에 대해 공유드립니다.\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e설문에 응답해주신 메테오라이트 티어 이상 생존자분들은 3,883명으로 집계 됐으며 아래와 같은 주요 답변에 응답 주셨습니다.\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e메테오라이트 승급 후 처음 유예 포인트를 얻을 때에만 유예 포인트 지급하는 방안\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003ctable border=\"0\" cellpadding=\"0\" cellspacing=\"0\" data-layout=\"center\" data-number-column=\"false\" data-table-display-mode=\"fixed\" data-table-width=\"1318\" data-testid=\"renderer-table\" width=\"1355\"\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd style=\"vertical-align: middle; text-align: center; background-color: rgb(204, 204, 204); width: 12.9151%;\"\u003e\u003cspan style=\"color: rgb(0, 0, 0);\"\u003e\u003cstrong\u003e응답자 티어\u003c/strong\u003e\u003c/span\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u003cbr\u003e\u003c/span\u003e\u003c/td\u003e\u003ctd style=\"vertical-align: middle; text-align: center; background-color: rgb(204, 204, 204); width: 37.0099%;\"\u003e\u003cspan style=\"color: rgb(0, 0, 0);\"\u003e\u003cstrong\u003e변경안 찬성\u003c/strong\u003e\u003cbr\u003e메테오라이트 최초 승격 시에만 유예 포인트 12 지급\u003c/span\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u003cbr\u003e\u003c/span\u003e\u003c/td\u003e\u003ctd style=\"vertical-align: middle; text-align: center; background-color: rgb(204, 204, 204); width: 50.0012%;\"\u003e\u003cspan style=\"color: rgb(0, 0, 0);\"\u003e\u003cstrong\u003e반대(현행 유지)\u003c/strong\u003e\
