\" style=\"text-align: center; width: 37.0583%;\" width=\"37.343173431734314%\"\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e87.30%\u003c/span\u003e\u003c/td\u003e\u003ctd class=\"xl72\" data-colwidth=\"334\" style=\"text-align: center; width: 50.1004%;\" width=\"52.988929889298895%\"\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e6~9 40.8%\u003c/span\u003e\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003ch4\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u003cbr\u003e\u003c/span\u003e\u003c/h4\u003e\u003ch4\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u003cstrong\u003e\u003cspan style=\"font-size: 18px;\"\u003e유예 포인트 변경 방식 안내\u003c/span\u003e\u003c/strong\u003e\u003c/span\u003e\u003c/h4\u003e\u003cul\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e위와 같은 설문 결과를 바탕으로 아래와 같이 유예 포인트의 지급 방식과 최대치가 변동될 예정입니다.\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e유예 포인트 지급 방식 변경: \u003cstrong\u003e12.6 패치노트부터 적용됩니다.\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e기존\u003c/span\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e유예 포인트가 적용되는 티어 내에서 승격 시마다 10 지급\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e랭크 게임 1회 정상 종료 시마다 유예 포인트 1 획득\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e변경\u003c/span\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e메테오라이트 승격 시에만 유예 포인트 12 지급\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e티어 승급 후에도 보유한 유예 포인트 유지\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e랭크 게임 1회 정상 종료 시마다 유예 포인트 1 획득\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003c/li\u003e\u003c/ul\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e티어 별 유예 포인트 최대치: \u003cstrong\u003e12.7 패치부터 적용될 예정입니다.\u0026nbsp;\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e메테오라이트: 12 → 12\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e미스릴: 12 → 12\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e데미갓: 12 → \u003cstrong\u003e10\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e이터니티: 12 → \u003cstrong\u003e8\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e유예 포인트 변경 적용 이후에도 지속적으로 피드백을 체크하고, 필요하다면 추가 설문 조사도 진행하면서 유예 포인트의 적정선을 찾아나갈 수 있도록 하겠습니다.\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u003cbr\u003e\u003c/span\u003e\u003c/p\u003e\u003ch5 class=\"er-point-title\"\u003e이벤트 모드 - 론울프\u003c/h5\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e고독한 늑대들의 시간, 이벤트 모드 론울프가 다시 시작됩니다.\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e론울프는 18명의 플레이어가 개인전으로 최후의 1인을 가리는 솔로 생존 게임입니다.\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u0026nbsp;\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u003cstrong\u003e운영 시간\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e론울프 모드는 이벤트 모드로서, 특정 시간대에만 매칭이 가능합니다.\u003c/span\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e아시아1 서버: 20:00 ~ 00:00 (KST)\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e아시아2 서버: 21:00 ~ 01:00 (KST)\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e아시아3 서버: 20:00 ~ 23:00 (KST)\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e북미 서버: 19:00 ~ 23:00 (ET)\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e유럽 서버: 17:00 ~ 21:00 (CET)\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e남미 서버: 17:00 ~ 20:00 (BRT)\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u003cbr\u003e\u003c/span\u003e\u003c/p\u003e\u003ch5 class=\"er-point-title\"\u003e시스템\u003c/h5\u003e\u003ch3\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u003cstrong\u003e\u003cspan style=\"font-size: 18px;\"\u003e매치메이킹 개선\u003c/span\u003e\u003c/strong\u003e\u003c/span\u003e\u003c/h3\u003e\u003cul\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e아시아: 상위권 큐가 세분화되며, 최상위 큐는 8,700점 이상으로 제한됩니다.\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e북미: 상위권 큐가 세분화되며, 최상위 큐는 메테오라이트 4 이상으로 제한됩니다.\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e유럽: 상위권 큐가 세분화되며, 최상위 큐는 다이아몬드 2 이상으로 제한됩니다.\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u003cbr\u003e\u003c/span\u003e\u003c/p\u003e\u003ch5 class=\"er-point-title\"\u003e게임 플레이\u003c/h5\u003e\u003ch3\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u003cstrong\u003e\u003cspan style=\"font-size: 18px;\"\u003e임시 안전 지대 점프 패들\u003c/span\u003e\u003c/strong\u003e\u003c/span\u003e\u003c/h3\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e임시 안전 지대 페이즈에 크로노 스피어가 도입되면서 교전 중 전술적인 이동 수단의 필요성이 커졌습니다. 이동 동선을 더욱 다양하게 설계할 수 있도록, 동일 지역 내부를 이동하는 점프 패들은 해당 페이즈에서도 사용할 수 있게 변경됩니다.\u003c/span\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e연못, 바지선 지역 내부를 이동하는 점프 패들은 임시 안전 지대 페이즈에서도 활성화 상태를 유지합니다.\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e그 외 점프 패들은 기존과 동일하게 임시 안전 지대 페이즈 돌입 시 비활성화됩니다.\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003ch3\u003e\u003cimg src=\"https://cdn.playeternalreturn.com/2026%2F10%2F14%2F1791957293460-08.+%EC%97%B0%EB%AA%BB+%EC%A0%90%ED%94%84.jpg\" class=\"fr-fil fr-dib fr-draggable\" style=\"width: 1000px;\"\u003e\u003c/h3\u003e\u003ch3\u003e\u003cbr\u003e\u003c/h3\u003e\u003cp\u003e\u003cimg src=\"https://cdn.playeternalreturn.com/2026%2F10%2F14%2F1791957298484-09.+%EB%B0%94%EC%A7%80%EC%84%A0+%EC%A0%90%ED%94%84.jpg\" class=\"fr-fil fr-dib fr-draggable\" style=\"width: 1000px;\"\u003e\u003c/p\u003e\u003ch3\u003e\u003cbr\u003e\u003c/h3\u003e\u003ch3\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u003cstrong\u003e\u003cspan style=\"font-size: 18px;\"\u003e크로노 스피어 스폰 위치 조정\u003c/span\u003e\u003c/strong\u003e\u003c/span\u003e\u003c/h3\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e지역 경계와 너무 가깝게 배치된 일부 크로노 스피어의 스폰 포인트가 조정됩니다.\u003c/span\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e창고, 연못 지역의 크로노 스피어 스폰 포인트 일부 조정\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u003cbr\u003e\u003c/span\u003e\u003c/p\u003e\u003ch5 class=\"er-point-title\"\u003e특성\u003c/h5\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u003cstrong\u003e파괴\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e액셀러레이터\u003c/span\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e공격 속도 증가 120% → \u003cstrong\u003e130%\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u0026nbsp;\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u003cstrong\u003e지원\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u0026nbsp;폭발 선인장\u003c/span\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e피해량 8~160(+대상 최대 체력의 6%) →\u003cstrong\u003e\u0026nbsp;\u003c/strong\u003e8~160\u003cstrong\u003e(+대상 최대 체력의 7%)\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u0026nbsp;\u003c/span\u003e\u003c/p\u003e\u003ch5 class=\"er-point-title\"\u003e전술 스킬\u003c/h5\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u003cstrong\u003e\u0026nbsp;강한 결속\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e잃어버린 체력 당 에너지 획득 1.5/1.2% → \u003cstrong\u003e2/1.5%\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u003cbr\u003e\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u003cbr\u003e\u003c/span\u003e\u003c/p\u003e\u003ch5 class=\"er-point-title\"\u003e무기 스킬\u003c/h5\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u003cstrong\u003e방망이 - 풀스윙(D)\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e기절 지속 시간 0.8/0.9/1초 → \u003cstrong\u003e0.7/0.8/0.9초\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u003cbr\u003e\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u003cstrong\u003e투척 - 연막탄(D)\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e2차 이동 속도 감소 30/35/40% → \u003cstrong\u003e20/25/30%\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u0026nbsp;\u003c/span\u003e\u003c/p\u003e\u003ch5 class=\"er-point-title\"\u003e실험체\u003c/h5\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u003cstrong\u003e나딘\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e활 나딘은 평균 피해량 지표가 낮아진 모습을 보이고 있습니다. 대치 구도에서 조금 더 유의미한 타격을 입힐 수 있도록 \u003cstrong\u003eQ - 황소의 눈\u003c/strong\u003e 스킬 증폭 계수를 상향하여 포킹 능력을 강화합니다.\u003c/span\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e황소의 눈(Q)\u003c/span\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e최소 피해량 60/95/130/165/200(+추가 공격력의 110%)(+스킬 증폭의 65%)(+야성 중첩 피해) → 60/95/130/165/200(+추가 공격력의 110%)\u003cstrong\u003e(+스킬 증폭의 70%)\u003c/strong\u003e(+야성 중첩 피해)\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e최대 피해량 120/190/260/330/400(+추가 공격력의 220%)(+스킬 증폭의 130%)(+야성 중첩 피해) → 120/190/260/330/400(+추가 공격력의 220%)\u003cstrong\u003e(+스킬 증폭의 140%)\u003c/strong\u003e(+야성 중첩 피해)\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u003cbr\u003e\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u003cstrong\u003e다르코\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e다르코는 대부분의 지표에서 평균 이하의 수치를 기록하고 있습니다. 교전 위력과 안정성을 높일 수 있도록 \u003cstrong\u003eW - 수금\u003c/strong\u003e의 보호막 흡수량을 늘리고, \u003cstrong\u003eE - 추심\u003c/strong\u003e의 피해량을 상향합니다.\u003c/span\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e수금(W)\u003c/span\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e보호막량 50/85/120/155/190(+공격력의 55%) → 50/85/120/155/190\u003cstrong\u003e(+공격력의 65%)\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e추심(E)\u003c/span\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e피해량 70/115/160/205/250(+공격력의 85%) → 70/115/160/205/250\u003cstrong\u003e(+공격력의 95%)\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u003cbr\u003e\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u003cstrong\u003e데비\u0026amp;마를렌\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e데비\u0026amp;마를렌은 매우 높은 피해량 지표를 기록하고 있습니다. 적에게 근접했을 때 발휘하는 교전 능력을 덜어내고자 \u003cstrong\u003e데비 W - 휠 댄스\u003c/strong\u003e의 대상 체력 비례 피해량을 하향 조정합니다.\u003c/span\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e휠 댄스(데비 W)\u003c/span\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e피해량 40/70/100/130/160(+추가 공격력 75%)(+대상 최대 체력의 5/5.5/6/6.5/7%) → 40/70/100/130/160(+추가 공격력 75%)\u003cstrong\u003e(+대상 최대 체력의 4/4.5/5/5.5/6%)\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u003cbr\u003e\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u003cstrong\u003e라우라\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e라우라가 적에게 진입한 후 보다 안정적으로 교전을 지속할 수 있도록 기본 방어력을 높이고 \u003cstrong\u003eW - 예고장\u0026nbsp;\u003c/strong\u003e적중 시의 체력 회복량을 상향합니다.\u003c/span\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e기본 방어력 51 → \u003cstrong\u003e52\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e예고장(W)\u003c/span\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e체력 회복량 18/26/34/42/50(+스킬 증폭의 8%) → 18/26/34/42/50\u003cstrong\u003e(+스킬 증폭의 10%)\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u003cbr\u003e\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u003cstrong\u003e로지\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e로지는 현재 뚜렷한 강점을 보이지 못하고 있습니다. 적에게 더욱 확실하게 피해를 누적시킬 수 있도록 \u003cstrong\u003eP - 더블샷\u003c/strong\u003e의 두 번째 타격 피해량을 상향하여 전반적인 화력을 높입니다.\u003c/span\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e더블샷(P)\u003c/span\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e2타 피해량 공격력의 50/55/60% → \u003cstrong\u003e55/60/65%\u0026nbsp;\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u003cbr\u003e\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u003cstrong\u003e루치아\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e루치아는 매우 낮은 점수 획득량을 이어가고 있습니다. 전반적인 위력을 높이기 위해 무기 숙련도 효과를 강화하고, \u003cstrong\u003eE - 무엄하시네요!\u003c/strong\u003e의 이동 거리를 늘려 교전 중 거리 조절 및 생존 능력을 보완합니다.\u003c/span\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e저격총 무기 숙련도 레벨 당\u003c/span\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e공격 속도 4% → \u003cstrong\u003e4.5%\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e스킬 증폭 4.2% → \u003cstrong\u003e4.3%\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e무엄하시네요!(E)\u003c/span\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e이동 거리 \"\u003e마이가 아군을 보호하거나 적을 추격할 때 더욱 유의미한 도움을 줄 수 있도록 \u003cstrong\u003eQ - 드레이프\u003c/strong\u003e의 이동 속도 감소 효과를 상향합니다.\u003c/span\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e드레이프(Q)\u003c/span\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e이동 속도 감소 10/15/20/25/30% → \u003cstrong\u003e15/20/25/30/35%\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u003cbr\u003e\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u003cstrong\u003e매그너스\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e매그너스가 게임 후반부에 보다 위협적인 일격을 가할 수 있도록 \u003cstrong\u003eR - 폭주 바이크\u003c/strong\u003e의 피해량을 상향 조정합니다.\u003c/span\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e폭주 바이크(R)\u003c/span\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e피해량 100/250/400(+추가 공격력의 150%)(+스킬 증폭의 90%)(+대상 현재 체력의 30%) → 100/\u003cstrong\u003e300/500\u003c/strong\u003e(+추가 공격력의 150%)(+스킬 증폭의 90%)(+대상 현재 체력의 30%)\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u003cbr\u003e\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u003cstrong\u003e바바라\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e바바라는 지속적인 약세를 보이고 있습니다. 무기 숙련도 효과를 상향하고, \u003cstrong\u003eRE - 광자력 수류탄\u003c/strong\u003e의 지속 피해량을 높여 전반적인 화력을 강화합니다.\u003c/span\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e권총 무기 숙련도 레벨 당 스킬 증폭 4.4% → \u003cstrong\u003e4.5%\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e오버클럭(R)\u003c/span\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e광자력 수류탄(RE) 지속 피해량 30/40/50(+스킬 증폭의 15%) → 30/40/50\u003cstrong\u003e(+스킬 증폭의 18%)\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u003cbr\u003e\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u003cstrong\u003e블레어\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e블레어는 매우 높은 피해량 지표를 기록하고 있습니다. 치명타 아이템 세팅을 갖췄을 때 발휘하는 위력을 견제하고자 무기 숙련도의 기본 공격 증폭 효과를 하향 조정합니다.\u003c/span\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e쌍검 무기 숙련도 레벨 당 기본 공격 증폭 1.6% → \u003cstrong\u003e1.5%\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u003cbr\u003e\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u003cstrong\u003e비형\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e비형은 대부분의 지표에서 높은 수치를 유지하고 있습니다. \u003cstrong\u003eP - 도깨비 불\u003c/strong\u003e의 대상 체력 비례 피해량과 \u003cstrong\u003eE - 내기 한판!\u003c/strong\u003e의 기본 피해량을 하향하여 강력한 교전 능력을 덜어냅니다.\u003c/span\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e도깨비 불(P)\u003c/span\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e피해량 16/24/32(+추가 공격력의 40%)(+대상 최대 체력의 1/2/3%) → 16/24/32(+추가 공격력의 40%)\u003cstrong\u003e(+대상 최대 체력의 0.8/1.6/2.4%)\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e내기 한판!(E)\u003c/span\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e피해량 80/110/140/170/200(+공격력의 100%) → \u003cstrong\u003e60/90/120/150/180\u003c/strong\u003e(+공격력의 100%)\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u003cbr\u003e\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u003cstrong\u003e세레스\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e세레스는 매우 높은 선택률과 함께 아군을 보호하는 데 있어 과도한 능력을 보여주고 있습니다. \u003cstrong\u003eR - 빛에게 바치는 맹세\u003c/strong\u003e가 제공하는 보호막의 최대 체력 계수를 낮춰 아군 보호 능력을 하향 조정합니다.\u003c/span\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e빛에게 바치는 맹세(R)\u003c/span\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e보호막량 24/36/48(+스킬 증폭의 5%)(+최대 체력의 1.2%) → 24/36/48(+스킬 증폭의 5%)\u003cstrong\u003e(+최대 체력의 1%)\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u003cbr\u003e\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u003cstrong\u003e셀린\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e셀린은 최상위 구간에서 높은 피해 능력을 바탕으로 뛰어난 성능을 보여주고 있습니다. \u003cstrong\u003eQ - 플라즈마 폭탄\u003c/strong\u003e의 기본 피해량을 낮춰 위력을 덜어냅니다.\u003c/span\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e플라즈마 폭탄(Q)\u003c/span\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e피해량 80/105/130/155/180(+스킬 증폭의 42%) → \u003cstrong\u003e70/95/120/145/170\u003c/strong\u003e(+스킬 증폭의 42%)\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u003cbr\u003e\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u003cstrong\u003e쇼우\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e쇼우는 공격적인 특성과 아이템 세팅에서도 뛰어난 내구도 지표를 기록하고 있습니다. 기본 내구도를 낮춰 지나친 안정성을 견제합니다.\u003c/span\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e레벨 당 방어력 3.4 → \u003cstrong\u003e3.2\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u003cbr\u003e\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u003cstrong\u003e수아\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e수아는 교전 안정성이 크게 낮아진 모습을 보이고 있습니다. \u003cstrong\u003eP - 마음의 양식\u003c/strong\u003e을 통한 체력 회복량을 상향하여 지속 교전 능력을 보완합니다.\u003c/span\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e마음의 양식(P)\u003c/span\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e체력 회복량 입힌 피해량의 35% → \u003cstrong\u003e40%\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u003cbr\u003e\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u003cstrong\u003e슈린\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e슈린은 적에게 진입한 뒤 교전을 지속하기에는 내구도가 다소 부족한 상태입니다. \u003cstrong\u003eP - 결심응진\u003c/strong\u003e의 체력 회복량을 상향하여 지속 교전 능력과 생존력을 보완합니다.\u003c/span\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e결심응진(P)\u003c/span\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e체력 회복량 20/35/50(+공격력의 40%) → 20/35/50\u003cstrong\u003e(+공격력의 50%)\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u003cbr\u003e\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u003cstrong\u003e아디나\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e아디나는 상위 구간에서 오랜 기간 강점을 보이지 못하고 있습니다. 무기 숙련도 효과를 상향하여 전반적인 위력을 높이고,\u003cstrong\u003e\u0026nbsp;E - 폴 디그니티\u003c/strong\u003e의 별 컨정션 효과 체력 회복량을 늘려 아군 보조 능력을 보강합니다.\u003c/span\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e아르카나 무기 숙련도 레벨 당 스킬 증폭 4.4% → \u003cstrong\u003e4.5%\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e폴 디그니티(E)\u003c/span\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e별 컨정션 효과 체력 회복량 20/30/40/50(+스킬 증폭의 6%) → \u003cstrong\u003e26/36/46/56(+스킬 증폭의 7%)\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u003cbr\u003e\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u003cstrong\u003e아르다\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e아르다는 여전히 낮은 피해량 지표를 기록하고 있습니다. 적에게 보다 유의미한 타격을 입힐 수 있도록\u003cstrong\u003e\u0026nbsp;W - 바빌론의 입방체\u0026nbsp;\u003c/strong\u003e피해량을 상향 조정합니다.\u003c/span\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e바빌론의 입방체(W)\u003c/span\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e1타 피해량 60/80/100/120/140(+스킬 증폭의 50%) → \u003cstrong\u003e70/90/110/130/150(+스킬 증폭의 55%)\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e바빌론의 주사위(RW)도 적용됩니다.\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u003cbr\u003e\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u003cstrong\u003e아이솔\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e아이솔이 지역 장악이나 적의 진입을 방해하는 과정에서 더욱 위협적인 모습을 보여줄 수 있도록 \u003cstrong\u003eR - Mok제 폭탄\u003c/strong\u003e의 피해량을 상향합니다.\u003c/span\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003eMok제 폭탄(R)\u003c/span\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e피해량 100/200/300(+공격력의 40%)(+스킬 증폭의 70%)(+대상 현재 체력의 12%) → 100/200/300\u003cstrong\u003e(+공격력의 50%)(+스킬 증폭의 75%)\u003c/strong\u003e(+대상 현재 체력의 12%)\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u0026nbsp;\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u003cstrong\u003e아이작\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e아이작은 매우 낮은 점수 획득량을 기록하고 있습니다. \u003cstrong\u003eW - 경화\u003c/strong\u003e로 \u003cstrong\u003eP - 착취\u003c/strong\u003e를 발동시켰을 때 적용되는 기본 스킬 재사용 대기시간 감소량을 상향하여 지속 교전 능력을 높입니다.\u003c/span\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e경화(W)\u003c/span\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e기본 스킬 쿨다운 감소 25% → \u003cstrong\u003e30%\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u003cbr\u003e\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u003cstrong\u003e이바\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e이바는 승률과 평균 순위 지표에서 매우 높은 수치를 유지하고 있습니다. 안정성이 지나친 상태로 판단되어, \u003cstrong\u003eE - 자수정의 물결\u003c/strong\u003e 이동 속도 증가량을 낮춰 이를 견제합니다.\u003c/span\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e자수정의 물결(E)\u003c/span\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e이동 속도 증가 120/125/130/135/140% → \u003cstrong\u003e110/115/120/125/130%\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u003cbr\u003e\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u003cstrong\u003e츠바메\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e츠바메 \u003cstrong\u003eW - 제비걸음\u003c/strong\u003e의 공격 속도 증가량을 상향하여 지속 피해 능력을 강화합니다.\u003c/span\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e제비걸음(W)\u003c/span\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e공격 속도 증가 15/20/25/30/35% → \u003cstrong\u003e20/25/30/35/40%\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u003cbr\u003e\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u003cstrong\u003e케네스\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e케네스는 교전에서 지나치게 강력한 위력을 발휘하고 있습니다. 뛰어난 기동성에 더해 피해 능력까지 높은 수치를 보여주고 있어, \u003cstrong\u003eQ - 분노의 일격\u003c/strong\u003e의 기본 피해량과 잃은 체력 비례 회복량을 낮추고 \u003cstrong\u003eE - 맹공격\u003c/strong\u003e의 기본 피해량도 하향하여 공격적인 아이템 세팅을 갖추지 않았을 때는 높은 피해 능력을 발휘하기 어렵도록 조정합니다.\u003c/span\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e분노의 일격(Q)\u003c/span\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e피해량 30/40/50/60/70(+공격력의 170/175/180/185/190%) → \u003cstrong\u003e10/20/30/40/50\u003c/strong\u003e(+공격력의 170/175/180/185/190%)\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e적중 시 체력 회복량 잃은 체력의 10%(최대 25%) → \u003cstrong\u003e8%(최대 20%)\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e맹공격(E)\u003c/span\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e피해량 8/16/24/32/40(+공격력의 25%) → \u003cstrong\u003e4/8/12/16/20\u003c/strong\u003e(+공격력의 25%)\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e 03e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e승리 연출 장면의 명암 대비 조정\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e먹구름 드론 스킨 사용 시 중심부가 잘못된 위치에 출력되는 문제 수정\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e일부 언어 환경에서 위클라인 처치 시스템 메시지에 실험체 이름이 출력되지 않는 문제 수정\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e일반 대전에서 카메라 파괴 시 크레딧이 지급되지 않는 문제 수정\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e연습 모드에서 자원 채우기 상세 설명이 잘못 출력되는 문제 수정\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e충전 - 섬광 아이템 스킬 피해가 근거리 상태에서 툴팁과 다르게 적용되는 문제 수정\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e일부 게임의 리플레이를 재생할 수 없는 문제 수정\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e관전 시 엔드 게임 BGM이 출력되지 않는 문제 수정\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u003cbr\u003e\u003c/span\u003e\u003c/p\u003e\u003ch3\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u003cspan style=\"font-size: 18px;\"\u003e\u003cstrong\u003e실험체 및 무기 개선 사항\u003c/strong\u003e\u003c/span\u003e\u003c/span\u003e\u003c/h3\u003e\u003cul\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e활 무기 스킬 곡사(D) 연출이 잘못 출력되는 문제 수정\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e일부 \u003cstrong\u003e띠아\u003c/strong\u003e 스킨 착용 중 색칠놀이(E) 이펙트가 실험체를 가리며 출력되는 문제 수정\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e3rd Anniversary \u003cstrong\u003e리오\u0026nbsp;\u003c/strong\u003e스킨(Dolce 포함) 착용 중 단궁 상태일 때 화궁 모델링이 출력되는 문제 수정\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e청춘, 한 컷 \u003cstrong\u003e비형\u003c/strong\u003e 스킨 승리 연출에서 상체 점이 모션과 함께 움직이지 않는 문제 수정\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e청춘, 한 컷 \u003cstrong\u003e비형\u003c/strong\u003e 스킨 승리 연출에서 무기가 어둡게 출력되는 문제 수정\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u003cstrong\u003e수아\u003c/strong\u003e 마음의 양식(P) 활성화 중 사운드가 지속 시간 동안 반복 출력되지 않는 문제 수정\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u003cstrong\u003e에키온\u003c/strong\u003e 일부 스킨 착용 중 특정 애니메이션이 어색하게 출력되는 문제 수정\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u003cstrong\u003e에키온\u003c/strong\u003e VF 폭주[데스에더] 상태에서 독사의 진노(R) 사용 시 미적중 시에도 지속 시간이 연장되는 문제 수정\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e메이드 \u003cstrong\u003e엠마\u003c/strong\u003e 스킨 로비 애니메이션에서 동물이 출력되지 않는 문제 수정\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u003cstrong\u003e이안\u003c/strong\u003e 해방(R) 귀신 상태에서 에어본 스킬 피해로 사망 시 복귀된 위치에서 에어본이 적용되는 문제 수정\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u003cstrong\u003e재키\u003c/strong\u003e 습격(E) 시전 위치 및 도착 위치가 같을 경우 피해가 즉시 적용되는 문제 수정\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e특정 상황에서 \u003cstrong\u003e코렐라인\u003c/strong\u003e 기본 공격 시 이펙트가 비정상적으로 출력되는 문제 수정\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u003cstrong\u003e크레이버\u003c/strong\u003e 관찰일지 상세 능력 내용 중 일부 문장이 어색하게 출력되는 문제 수정\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e사격 교관 \u003cstrong\u003e테오도르\u003c/strong\u003e 스킨 착용 중 휴식 시 스킨 상자 오브젝트가 잘못 출력되는 문제 수정\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e특정 상황에서 \u003cstrong\u003e펜리르\u003c/strong\u003e 최후의 발악(P) 불사 상태일 때 공포 효과가 늦게 발동되는 문제 수정\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e하우스키퍼 \u003cstrong\u003e피오라\u003c/strong\u003e 스킨 착용 중 휴식 시 무기 모델링이 출력되지 않는 문제 수정\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u003cbr\u003e\u003c/span\u003e\u003c/p\u003e\u003ch3\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u003cstrong\u003e\u003cspan style=\"font-size: 18px;\"\u003e로비 개선 사항\u003c/span\u003e\u003c/strong\u003e\u003c/span\u003e\u003c/h3\u003e\u003cul\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e프로필 대전 기록과 대전 기록 상세에서 갬빗으로 획득한 점수에 따라 !!, !, ?, ?? 기보 기호가 표기되고, 기호에 마우스 오버 시 툴팁이 출력되도록 추가\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e매칭 중에도 A-Coin, NP 등 게임 재화로 구매하는 상품과 교환소 상품을 구매할 수 있도록 개선하고, 현금 결제 상품은 기존과 같이 매칭 중 구매 불가 유지\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e진행 중인 이벤트 미션이 있을 때 로그인 시 이벤트 미션 진행 안내와 가장 먼저 만료되는 미션의 남은 시간이 표시되고, 안내 클릭 시 미션 패널의 이벤트 미션 탭이 열리도록 추가\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e미보유 퀘스트 북 화면에서 레벨 영역이 비어 보이고 모드 전환·일괄 획득 버튼이 노출되던 문제 수정\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e시즌 12 이스포츠 서포트 패키지 전라남도 팀 로비 배경 이미지의 색감 수정\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e보이스 타이핑 용어집을 업데이트하여 일부 오인식 사례 개선\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e특정 상황에서 시즌 조각팩 개봉 시 보유 중인 시즌 조각의 자동 분해 연출이 출력되지 않는 문제 수정\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e컬렉션에서 획득 가능한 보상이 없는 상태일 때 알림이 출력되는 문제 수정\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e상점에서 추가된 상품을 이미 보유 중일 때 관련 탭에 알림이 출력되는 문제 수정\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e치지직 엄지척 이모티콘이 어색하게 출력되는 문제 수정\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e아이돌 마이 맛있어! 이모티콘이 어색하게 출력되는 문제 수정\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e패키지 상품 구매 팝업에서 로비 스크린 미리보기가 출력되지 않는 문제 수정\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e프로필 설정의 아이콘 및 배경 아이템에 마우스 오버 시 하이라이트 효과가 적용되지 않는 문제 수정\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e시즌팩 팝업에서 승리 연출 재생 시 배경이 어둡게 출력되는 문제 수정\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e시나리오에서 일부 실험체 이미지 테두리에 잔여 이미지가 출력되는 문제 수정\u003c/span\u003e\u003c/p\u003e\u003c/li\u00
