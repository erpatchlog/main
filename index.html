을 기준으로 보상이 지급됩니다.\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u003cstrong\u003e루미아 유니온과 코발트 유니온 보상은 별도로 지급 되어, 총 2번의 티어 보상을 받을 수 있습니다.\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u003cstrong\u003e히스이 따봉\u003c/strong\u003e 이모티콘을 포함한 유니온 대전(Beta) 보상은 보상 기간 내 접속 시 우편으로 지급될 예정이며, 우편 지급일로부터 90일 이내에 획득 가능합니다.\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e단, 이모티콘 참여 보상은 팀 유지 여부와 상관없이, 시즌 기간 내 참여한 모든 팀(루미아 및 코발트 포함)에서 플레이한 기록이 합산됩니다.\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cbr\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u003cstrong\u003e\u003cspan style=\"font-size: 18px;\"\u003e시즌12 코발트 유니온 대전\u003c/span\u003e\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e루미아 섬 유니온 대전과는 다른, 4인 사전 구성 팀의 전략적 재미를 느낄 수 있는 코발트 유니온 대전이 돌아왔습니다.\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e코발트 유니온 대전에서, 진짜 코발트 최강자에 도전하세요!\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u003cstrong\u003e코발트 유니온 대전의 특징\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u003cstrong\u003e팀 구성:\u003c/strong\u003e 반드시 \u003cstrong\u003e4인\u003c/strong\u003e이 하나의 팀을 구성해야 매칭이 가능합니다. 한 플레이어는 팀장으로서 1개, 팀원으로 최대 3개의 팀에 소속될 수 있습니다.\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u003cstrong\u003e참여 조건:\u003c/strong\u003e 계정 레벨 3 이상부터 참여할 수 있습니다.\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u003cstrong\u003e운영 기간:\u003c/strong\u003e 운영 기간: 09월 17일 (목) ~ 9월 30일 (수)\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u003cstrong\u003e운영 시간:\u003c/strong\u003e 서버 별로 정해진 시간에 운영됩니다. (다른 매치메이킹 지역 유니온 대전에도 참여 가능합니다.)\u003c/span\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e아시아1 서버: \u003cstrong\u003e매일 오후 10시 ~ 12시\u003c/strong\u003e에 운영됩니다.\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e해외 서버는 주말에 운영됩니다.\u003c/span\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e유럽: \u003cstrong\u003e토, 일 오전 5시 ~ 7시\u003c/strong\u003e (KST)\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e북미: \u003cstrong\u003e토, 일 오후 12시 ~ 2시\u003c/strong\u003e (KST)\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e아시아2: \u003cstrong\u003e금,토,일 오후 11시~오전 1시\u0026nbsp;\u003c/strong\u003e(KST)\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003c/li\u003e\u003c/ul\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u003cbr\u003e\u003c/span\u003e\u003c/p\u003e\u003ch5 class=\"er-point-title\"\u003e시스템\u003c/h5\u003e\u003ch3\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u003cstrong\u003e\u003cspan style=\"font-size: 18px;\"\u003e아카이브\u003c/span\u003e\u003c/strong\u003e\u003c/span\u003e\u003c/h3\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e신규 메인 에피소드가 아카이브에 추가됩니다.\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cimg src=\"https://cdn.playeternalreturn.com/2026%2F09%2F16%2F1789538209852-06.+%EC%97%90%ED%94%BC%EC%86%8C%EB%93%9C2+%EC%9D%BC%EB%9F%AC%EC%8A%A4%ED%8A%B81_%EB%AF%B8%EB%A6%AC%EB%B3%B4%EA%B8%B0%EC%9A%A9.png\" class=\"fr-fil fr-dib fr-draggable\" style=\"width: 1000px;\"\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u003cstrong\u003e메인 에피소드 - [Ep.2 What the Ashes Remember]\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u003cem\u003e“모든 것이 타버려도 재는 남기에.”\u003c/em\u003e\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u003cbr\u003e\u003c/span\u003e\u003c/p\u003e\u003ch3\u003e\u003cspan style=\"color: rgb(255, 255, 255); font-size: 18px;\"\u003e\u003cstrong\u003e갬빗 (Gambit)\u003c/strong\u003e\u003c/span\u003e\u003c/h3\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e하이 리스크와 하이 리턴으로 랭크 포인트(RP) 획득에 도전하는 \u003cstrong\u003e갬빗\u003c/strong\u003e 시스템이 추가됩니다.\u003c/span\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e갬빗 시스템은 12.4 업데이트 시점부터 ~ 12.7 업데이트 전까지 시범 운용됩니다.\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cimg src=\"https://cdn.playeternalreturn.com/2026%2F09%2F16%2F1789538112188-07.+Gambit.gif\" class=\"fr-fil fr-dib fr-draggable\"\u003e\u003c/p\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u003cstrong\u003e갬빗 참여 방법\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e정규 시즌 랭크 게임에 \u003cstrong\u003e솔로로 참여한 경우\u003c/strong\u003e에만 갬빗을 선언할 수 있습니다.\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e전략맵 - 루트 선택 단계 종료 전까지 갬빗 참여 버튼을 \u003cstrong\u003e1초간 클릭을 유지\u003c/strong\u003e하면 갬빗을 선언합니다.\u003c/span\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e전략맵 - 게임 준비 단계(게임 시작 5초 전)부터는 선언할 수 없습니다.\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e갬빗 선언은 되돌릴 수 없으며, 선언 여부는 같은 팀원을 포함해 매치 내 다른 플레이어에게 표시되지 않습니다.\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e갬빗 선언은 다이아몬드 티어 이하에서만 가능합니다.\u003c/span\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e갬빗 선언이 불가한 티어는 전략맵 갬빗 참여 버튼이 비활성화되고 \"갬빗 불가 티어\"로 표시됩니다.\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u003cbr\u003e\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u003cstrong\u003e불릿\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e갬빗을 선언하려면 \u003cstrong\u003e불릿\u003c/strong\u003e이 필요합니다.\u003c/span\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e불릿은 매주 목요일 05:00(KST)에 랭크 티어별로 정해진 개수만큼 접속 시 지급됩니다.\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e티어별 최대 누적 개수를 초과한 불릿은 소멸됩니다.\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003ctable style=\"width: 61%; margin-right: calc(39%);\"\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd style=\"width: 50%; text-align: center; background-color: rgb(204, 204, 204);\"\u003e\u003cspan style=\"color: rgb(0, 0, 0);\"\u003e\u003cstrong\u003e티어\u003c/strong\u003e\u003c/span\u003e\u003c/td\u003e\u003ctd style=\"width: 50%; text-align: center; background-color: rgb(204, 204, 204);\"\u003e\u003cspan style=\"color: rgb(0, 0, 0);\"\u003e\u003cstrong\u003e주간 지급 개수(=최대 누적 개수)\u003c/strong\u003e\u003c/span\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u003cbr\u003e\u003c/span\u003e\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd style=\"width: 50%; text-align: center;\"\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e아이언 ~ 다이아몬드\u003cbr\u003e\u003c/span\u003e\u003c/td\u003e\u003ctd style=\"width: 50%; text-align: center;\"\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e2\u003cbr\u003e\u003c/span\u003e\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd style=\"width: 50%; text-align: center;\"\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e메테오라이트 이상\u003cbr\u003e\u003c/span\u003e\u003c/td\u003e\u003ctd style=\"width: 50%; text-align: center;\"\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e갬빗 불가\u003cbr\u003e\u003c/span\u003e\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u003cbr\u003e\u003c/span\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e보유 불릿은 프로필 - 개요 및 리그 페이지, 랭크 티어 정보 페이지의 RP 수치 아래에서 확인할 수 있습니다.\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cimg src=\"https://cdn.playeternalreturn.com/2026%2F09%2F16%2F1789538227722-08.+%EB%B6%88%EB%A6%BF.gif\" class=\"fr-fil fr-dib fr-draggable\" style=\"width: 322px;\"\u003e\u003c/p\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u003cstrong\u003e갬빗 \u0026amp; 킹스 갬빗\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u003cstrong\u003e갬빗\u003c/strong\u003e: 게임 종료 후 획득 또는 차감되는 RP 배율이 \u003cstrong\u003e200%\u003c/strong\u003e로 적용됩니다.\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u003cstrong\u003e킹스 갬빗\u003c/strong\u003e: 같은 팀원 전원이 갬빗을 선언한 경우 전략맵 - 게임 준비 단계에서 킹스 갬빗으로 전환되며,\u003cbr\u003eRP 배율이 \u003cstrong\u003e300%\u003c/strong\u003e로 적용됩니다. 킹스 갬빗 전환 시에는 팀원 모두에게 전환 연출이 표시됩니다.\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e인게임 스코어 HUD의 RP 표기는 갬빗 배율이 적용된 값으로 표시됩니다.\u003c/span\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003eex) 입장료를 20 RP 지불한다면, 갬빗 적용 시 40 RP 지불, 킹스 갬빗 적용 시 60 RP 지불 후 게임 시작\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e칭찬 투표 화면, 매칭 요약, 결과 통계 화면에서 갬빗 및 킹스 갬빗 참여 여부를 확인할 수 있습니다. 갬빗으로 얻거나 잃은 점수에 따라 기보 기호(!!, !, ?, ??)로 결과가 표시됩니다.\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cimg src=\"https://cdn.playeternalreturn.com/2026%2F09%2F16%2F1789538256423-09.+%EA%B0%AC%EB%B9%97+%EA%B2%B0%EA%B3%BC_%ED%8C%A8%EB%85%B8%EC%9A%A9.gif\" class=\"fr-fil fr-dib fr-draggable\"\u003e\u003c/p\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u003cem\u003e※ 갬빗 선언 후 닷지한 유저의 불릿은 차감됩니다. 닷지 플레이어와 같은 팀원의 불릿은 갬빗 선언 시에도 차감되지 않습니다.\u0026nbsp;\u003c/em\u003e\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u003cem\u003e※ 영구적 탈주 처리된 플레이어는 갬빗이 적용되지 않으며, 탈주 페널티는 기존과 동일하게 적용됩니다. 갬빗 선언 후 탈주 유저의 불릿은 차감됩니다. 탈주 유저와 같은 팀원의 불릿은 갬빗 선언 시에도 차감되지 않고, 갬빗 배율도 적용되지 않습니다.\u003c/em\u003e\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u003cbr\u003e\u003c/span\u003e\u003c/p\u003e\u003ch3\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u003cstrong\u003e\u003cspan style=\"font-size: 18px;\"\u003e보이스 타이핑 (Beta)\u003c/span\u003e\u003c/strong\u003e\u003c/span\u003e\u003c/h3\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e인게임에서 음성으로 팀원과 채팅할 할 수 있도록, 말한 내용을 텍스트로 변환해서 채팅창으로 보내주는 \u003cstrong\u003e보이스 타이핑 (Beta)\u003c/strong\u003e기능이 추가됩니다. 음성 채팅과 달리 내 목소리가 팀원에게 전달되지 않고 텍스트만 전송됩니다.\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cimg src=\"https://cdn.playeternalreturn.com/2026%2F09%2F16%2F1789538270502-10.+%EB%B3%B4%EC%9D%B4%EC%8A%A4+%ED%83%80%EC%9D%B4%ED%95%91+%EC%84%A4%EC%A0%95_%ED%8C%A8%EB%85%B8%EC%9A%A9.gif\" class=\"fr-fil fr-dib fr-draggable\"\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e설정 - 음성 - \u003cstrong\u003e입력 설정\u003c/strong\u003e의 음성 채팅 항목에서 [보이스 타이핑 (Beta)]를 선택하면 사용할 수 있습니다. 음성 채팅과 동시에 사용할 수는 없습니다.\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e보이스 타이핑 (Beta)은 \u003cstrong\u003e시즌 팩 구매 시\u003c/strong\u003e 사용할 수 있으며, 한국어, 영어, 일본어, 중국어(간체/번체)를 지원합니다. 그 외의 언어는 영어로 인식됩니다.\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u003cstrong\u003e음성 입력 방법\u003c/strong\u003e: 눌러서 말하기(기본) 또는 음성 감지 중 선택할 수 있습니다.\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u003cstrong\u003e보이스 타이핑 전송\u003c/strong\u003e: 변환된 텍스트를 바로 보내는 [즉시 보내기](기본)와, 채팅 입력 창에서 확인한 뒤 눌러서 말하기 / 변환 텍스트 보내기 단축키(또는 Enter)를 눌러 보내는 [검토하고 보내기] 중 선택할 수 있습니다. 검토 중 ESC 키를 누르면 변환된 텍스트가 삭제됩니다.\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e변환 중인 텍스트는 채팅 입력 창에 \u003cem\u003e이탤릭체\u003c/em\u003e로, 변환이 완료된 텍스트는 일반 서체로 표시되며, 변환된 텍스트는 직접 수정할 수 없습니다.\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e인게임 채팅창 상단의 보이스 타이핑 상태 아이콘으로 현재 상태(ON / OFF / 입력중 / 일시 오류)를 확인하고, 클릭해 기능을 켜고 끌 수 있습니다.\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e보이스 타이핑은 팀원이 있는 게임 모드 플레이 중에만 동작하며 팀 로비, 사용자 설정 대전 로비, 전략맵 등 게임 플레이 내부가 아닌 경우 사용할 수 없습니다. 또한 팀원이 없는 론울프에서도 사용할 수 없습니다.\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cimg src=\"https://cdn.playeternalreturn.com/2026%2F09%2F16%2F1789538292635-11.+%EB%B3%B4%EC%9D%B4%EC%8A%A4+%ED%83%80%EC%9D%B4%ED%95%91+%EC%9D%B8%EA%B2%8C%EC%9E%84_KR.gif\" class=\"fr-fil fr-dib fr-draggable\"\u003e\u003c/p\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u003cem\u003e※ 보이스 타이핑으로 전송되는 텍스트에도 채팅과 동일하게 금칙어 필터가 적용됩니다.\u003c/em\u003e\u003cbr\u003e\u003cem\u003e※ 보이스 타이핑을 통한 운영 원칙에 위배되는 행위가 적발되는 경우에도 동일하게 운영정책에 따라 조치될 수 있습니다.\u003c/em\u003e\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u003cbr\u003e\u003c/span\u003e\u003c/p\u003e\u003ch3\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u003cstrong\u003e\u003cspan style=\"font-size: 18px;\"\u003e마우스 커서 사이즈 옵션\u003c/span\u003e\u003c/strong\u003e\u003c/span\u003e\u003c/h3\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003eOS의 마우스 크기 설정을 바꾸지 않고도 게임 내에서 커서 크기를 조절할 수 있도록, 설정 - 화면 탭에 마우스 커서 옵션이 추가됩니다.\u003c/span\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u003cstrong\u003e마우스 커서 방식\u003c/strong\u003e: 하드웨어 커서(권장) / 소프트웨어 커서 중 선택할 수 있습니다. 기본값은 하드웨어 커서입니다.\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u003cstrong\u003e소프트웨어 마우스 커서 사이즈\u003c/strong\u003e: 소프트웨어 커서 선택 시 32x32 / 48x48 / 64x64 / 96x96 / 128x128 중 마우스 커서 크기를 선택할 수 있으며, 인게임과 로비의 모든 커서에 일괄 적용됩니다.\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u003cem\u003e※ 소프트웨어 커서 사용 시 화면 프레임에 맞춰 렌더링되므로, 사양에 따라 커서 움직임의 반응성이 떨어질 수 있습니다.\u003c/em\u003e\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u003cimg src=\"https://cdn.playeternalreturn.com/2026%2F09%2F16%2F1789538311928-12.+%EB%A7%88%EC%9A%B0%EC%8A%A4+%ED%81%AC%EA%B8%B0+%EB%B3%80%EA%B2%BD.gif\" class=\"fr-fil fr-dib fr-draggable\"\u003e\u003c/span\u003e\u003c/p\u003e\u003ch3\u003e\u003cbr\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u003cstrong\u003e\u003cspan style=\"font-size: 18px;\"\u003e매치메이킹 개선\u003c/span\u003e\u003c/strong\u003e\u003c/span\u003e\u003c/h3\u003e\u003cul\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u003cstrong\u003e아시아 서버에서 이제 다이아몬드 티어도 랭크 대전에서 사전구성팀을 선택할 수 있습니다.\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e아시아: 상위권 큐가 전체적으로 세분화 되며 최상위 큐가 미스릴 8300점 이상으로 제한됩니다.\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e북미: 상위권 큐가 전체적으로 세분화 되며 최상위 큐가 다이아몬드 2 이상으로 제한됩니다.\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e유럽: 상위권 큐가 전체적으로 세분화 되며 최상위 큐가 다이아몬드 4 이상으로 제한됩니다.\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u003cbr\u003e\u003c/span\u003e\u003c/p\u003e\u003ch5 class=\"er-point-title\"\u003e게임플레이\u003c/h5\u003e\u003ch3\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u003cstrong\u003e\u003cspan style=\"font-size: 18px;\"\u003e최종 탈락 팀의 카메라 및 드론 파괴\u003c/span\u003e\u003c/strong\u003e\u003c/span\u003e\u003c/h3\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e이미 탈락한 팀의 설치물이 남은 플레이어들의 시야 정보에 혼선을 주지 않도록, 팀이 최종 탈락하는 시점에 해당 팀이 설치한 카메라와 드론이 자동으로 파괴됩니다.\u003c/span\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e파괴 대상: 망원 카메라, 위장 카메라, 주시자의 눈 - 박쥐, 정찰 드론, EMP 드론\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e팀 전멸로 인한 최종 탈락 시점을 기준으로 처리되며, 전멸 방지 페이즈에서 팀이 전멸한 경우에는 유지됩니다.\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e나딘의 덫, 아이솔의 지뢰 등 실험체 스킬로 설치한 트랩류는 기존과 동일하게 유지됩니다.\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u003cbr\u003e\u003c/span\u003e\u003c/p\u003e\u003ch3\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u003cstrong\u003e\u003cspan style=\"font-size: 18px;\"\u003e설치형 오브젝트 설치 제한\u003c/span\u003e\u003c/strong\u003e\u003c/span\u003e\u003c/h3\u003e\u003cul\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e휴대용 키오스크, 휴대용 VLS, 사냥꾼의 솥단지 등 가젯 스킬을 \u003cstrong\u003e균열\u003c/strong\u003e 및 \u003cstrong\u003e루프 카드키-γ가 설치된\u003c/strong\u003e 범위와 인접한 위치에 설치할 수 없도록 변경됩니다.\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e루프 카드키-γ 설치 역시 균열 및 다른 설치형 가젯 범위와 인접한 위치에는 설치할 수 없습니다.\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e균열 예정 지역에는 기존과 동일하게 설치할 수 있습니다.\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003ch3\u003e\u003cimg src=\"https://cdn.playeternalreturn.com/2026%2F09%2F16%2F1789538338534-13.+%EC%84%A4%EC%B9%98+%EB%B6%88%EA%B0%802.gif\" class=\"fr-fil fr-dib fr-draggable\"\u003e\u003c/h3\u003e\u003ch3\u003e\u003cbr\u003e\u003c/h3\u003e\u003ch3\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u003cstrong\u003e\u003cspan style=\"font-size: 18px;\"\u003e생명의 나무 및 운석 스폰 조정\u003c/span\u003e\u003c/strong\u003e\u003c/span\u003e\u003c/h3\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e2일차 낮에 운석이 밀집해 떨어지는 상황을 완화하기 위해 해당 페이즈의 오브젝트 스폰 방식이 조정됩니다.\u003c/span\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e2일차 낮\u003c/span\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e생명의 나무 생성 지역 절, 호텔, 묘지 → \u003cstrong\u003e호텔, 묘지\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e운석 드랍 개수 2 → \u003cstrong\u003e3\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u003cbr\u003e\u003c/span\u003e\u003c/p\u003e\u003ch3\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u003cstrong\u003e\u003cspan style=\"font-size: 18px;\"\u003e크로노 스피어\u003c/span\u003e\u003c/strong\u003e\u003c/span\u003e\u003c/h3\u003e\u003cul\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e임시 안전지대 크로노 스피어 2차 축소 범위 5m → \u003cstrong\u003e4m\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u003cbr\u003e\u003c/span\u003e\u003c/p\u003e\u003ch3\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u003cstrong\u003e\u003cspan style=\"font-size: 18px;\"\u003e크레딧\u003c/span\u003e\u003c/strong\u003e\u003c/span\u003e\u003c/h3\u003e\u003cul\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e1일차 밤 자연 크레딧 획득량 1.5초 당 1 → \u003cstrong\u003e1.45초 당 1\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e적 실험체 처치/처치 관여 시 획득 크레딧 10/6 → \u003cstrong\u003e10/8\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u003cbr\u003e\u003c/span\u003e\u003c/p\u003e\u003ch5 class=\"er-point-title\"\u003e특성\u003c/h5\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u003cstrong\u003e혼돈\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e도깨비불\u003c/span\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e피해량 60~250(+추가 공격력의 70%)(+스킬 증폭의 20%) → \u003cstrong\u003e80~270\u003c/strong\u003e(+추가 공격력의 70%)(+스킬 증폭의 20%)\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e속사\u003c/span\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e지속 시간 5초 → \u003cstrong\u003e6초\u003c/strong\u003e\u0026nbsp;\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u0026nbsp;\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u003cstrong\u003e지원\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e폭발 선인장\u003c/span\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e피해량 8~160(+대상 최대 체력의 5%) → 8~160\u003cstrong\u003e(+대상 최대 체력의 6%)\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u003cbr\u003e\u003c/span\u003e\u003c/p\u003e\u003ch5 class=\"er-point-title\"\u003e무기 스킬\u003c/h5\u003e\u003cul\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u003cstrong\u003eVF 의수 - VF 안정화(D)\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e사용 중 전술 스킬 - 블링크를 사용할 수 있도록 개선됩니다.\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u003cbr\u003e\u003c/span\u003e\u003c/p\u003e\u003ch5 class=\"er-point-title\"\u003e실험체\u003c/h5\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u003cstrong\u003e나딘\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e나딘은 상위 구간에서 지속적으로 높은 성능을 보여주고 있습니다. 특히 \u003cstrong\u003eR - 늑대 맹습\u003c/strong\u003e을 사용했을 때의 거리 조절 능력이 뛰어나다고 판단되어, 해당 스킬의 둔화량을 낮춰 위력을 하향 조정합니다.\u003c/span\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e늑대 맹습(R)\u003c/span\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e이동 속도 감소 30% → \u003cstrong\u003e25%\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u0026nbsp;\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u003cstrong\u003e니아\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e니아는 낮은 점수 획득량과 피해량 지표를 기록하고 있습니다. \u003cstrong\u003eQ - 아케이드 드롭\u003c/strong\u003e의 경로 피해량을 상향하여 스킬을 잘 활용했을 때의 위력을 강화합니다.\u003c/span\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e아케이드 드롭(Q)\u003c/span\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e경로 피해량 30/55/80/105/130(+스킬 증폭의 40%) → 30/55/80/105/130(\u003cstrong\u003e+스킬 증폭의 45%\u003c/strong\u003e)\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u0026nbsp;\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u003cstrong\u003e니키\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e니키는 매우 높은 선택률과 함께 다른 지표에서도 준수한 성능을 보여주고 있습니다. 특히 \u003cstrong\u003eP - 다혈질\u003c/strong\u003e 상태에서의 누적 피해량이 다소 높게 측정되고 있어, 해당 스킬의 피해량을 낮춰 교전 능력을 일부 견제합니다.\u003c/span\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e다혈질(P)\u003c/span\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e피해량 60/85/110(+스킬 증폭의 35%) → \u003cstrong\u003e60/80/100\u003c/strong\u003e(+스킬 증폭의 35%)\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u0026nbsp;\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u003cstrong\u003e다니엘\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e다니엘은 매우 낮은 승률을 기록하고 있습니다. 게임 후반부 적 핵심 대상에게 진입하는 플레이의 위험도가 지나치게 높아진 것으로 판단되어, 레벨 당 방어력을 높여 후반부 내구도를 일부 보완합니다.\u003c/span\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e레벨 당 방어력 2.8 → \u003cstrong\u003e3\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u0026nbsp;\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u003cstrong\u003e데비\u0026amp;마를렌\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e데비\u0026amp;마를렌은 낮은 점수 획득량을 기록하고 있습니다. 적중 시 리턴이 부족하다고 판단되는 \u003cstrong\u003e마를렌 E - 지금이야, 데비!\u003c/strong\u003e의 에어본 시간을 늘려 위력을 강화합니다.\u003c/span\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e지금이야, 데비!(마를렌 E)\u003c/span\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e에어본 지속 시간 0.5초 → \u003cstrong\u003e0.55초\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u0026nbsp;\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u003cstrong\u003e띠아\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e띠아는 상위 구간에서 높은 지표를 유지하고 있습니다. 활용도가 높은 \u003cstrong\u003eP - 알록달록 컬러믹스\u003c/strong\u003e 마법의 다람쥐 피해량을 낮춰 성능을 일부 견제합니다.\u003c/span\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e알록달록 컬러믹스(P)\u003c/span\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e마법의 다람쥐(파란색+노란색) 피해량 50/90/130/170/210(+스킬 증폭의 95%) → 50/90/130/170/210\u003cstrong\u003e(+스킬 증폭의 90%)\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u0026nbsp;\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u003cstrong\u003e라우라\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e라우라는 높은 점수 획득량을 유지하고 있습니다. 초중반 구간에서 보여주는 뛰어난 기동력을 견제하기 위해 \u003cstrong\u003eE - 우아한 발걸음\u003c/strong\u003e의 초반 재사용 대기시간을 늘려, 조금 더 신중한 스킬 사용을 유도합니다.\u003c/span\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e우아한 발걸음(E)\u003c/span\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e쿨다운 17/16/15/14/13초 → \u003cstrong\u003e19/17.5/16/14.5/13초\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u0026nbsp;\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u003cstrong\u003e레온\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e레온은 상위권을 제외한 대부분의 구간에서 매우 높은 통계를 기록하고 있습니다. 대처 능력에 따라 차이가 발생하는 \u003cstrong\u003eE - 잠영\u003c/strong\u003e의 피해량을 낮춰, 적중 시 발휘되는 순간 화력을 하향 조정합니다.\u003c/span\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e잠영(E)\u003c/span\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e피해량 60/95/130/165/200(+스킬 증폭의 75%) → 60/95/130/165/200\u003cstrong\u003e(+스킬 증폭의 65%)\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u0026nbsp;\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u003cstrong\u003e루치아\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e루치아는 매우 낮은 점수 획득량을 기록하고 있습니다. \u003cstrong\u003eP - 영애의 소양\u003c/strong\u003e의 이동 속도 증가 시간을 늘려 보다 유연하게 위치를 잡고 거리를 유지할 수 있도록 하며, \u003cstrong\u003eR - 총사의 예법\u003c/strong\u003e의 기절 지속 시간을 늘려 적중 시 리턴을 강화합니다.\u003c/span\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e영애의 소양(P)\u003c/span\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e이동 속도 증가 시간 0.75초 → \u003cstrong\u003e1초\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e총사의 예법(R)\u003c/span\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e기절 지속 시간 0.7초 → \u003cstrong\u003e0.8초\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u0026nbsp;\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u003cstrong\u003e리 다이린\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e리 다이린은 공격적인 아이템 세팅에서도 평균 피해량이 낮게 기록되고 있습니다.\u003cstrong\u003e\u0026nbsp;E - 술 뿌리기\u003c/strong\u003e의 피해량 계수를 높여 적중 시 더 유의미한 피해를 입힐 수 있도록 개선합니다.\u003c/span\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e술 뿌리기(E)\u003c/span\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e피해량 50/100/150/200/250(+공격력의 90%) → 50/100/150/200/250\u003cstrong\u003e(+공격력의 100%)\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u0026nbsp;\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u003cstrong\u003e미르카\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e미르카는 기본 내구도가 보완된 이후에도 낮은 지표를 유지하고 있습니다. 전반적인 성능이 부족해진 것으로 판단되어, \u003cstrong\u003eQ - 크래시 해머\u003c/strong\u003e와 \u003cstrong\u003eE2 - 파워 히트\u003c/strong\u003e의 강화 시 위력을 높여 보완합니다.\u003c/span\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e크래시 해머(Q)\u003c/span\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e크래시 해머 강화 기절 지속 시간 0.65초 → \u003cstrong\u003e0.7초\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e백스텝 러시(E)\u003c/span\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e파워 히트(E2) 강화 시 추가 피해량 리펄스 게이지의 40% → \u003cstrong\u003e50%\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u0026nbsp;\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u003cstrong\u003e버니스\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e버니스는 높은 점수 획득량과 피해량을 기록하고 있습니다. 무기 숙련도의 공격 속도 증가 효과를 낮춰 성능을 일부 견제합니다.\u003c/span\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e저격총 무기 숙련도 레벨 당 공격 속도 2.8% → \u003cstrong\u003e2.4%\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u0026nbsp;\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u003cstrong\u003e비형\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e비형은 전반적인 지표에서 뚜렷한 강점을 보여주지 못하고 있습니다. 주력 스킬인 \u003cstrong\u003eQ - 뚝딱!\u003c/strong\u003e의 피해량을 높여, 지속 교전에서 보다 강한 위력을 발휘할 수 있도록 개선합니다.\u003c/span\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e뚝딱!(Q)\u003c/span\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e피해량 20/40/60/80/100(+공격력의 9/18/27/36/45%) → 20/40/60/80/100\u003cstrong\u003e(+공격력의 10/20/30/40/50%)\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u0026nbsp;\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u003cstrong\u003e샬럿\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e샬럿은 상위 구간에서 지나치게 높은 승률을 기록하고 있습니다. 레벨 당 방어력을 낮춰 상대가 샬럿을 먼저 노리는 플레이가 유효하도록 하며, \u003cstrong\u003eR - 기적 실현\u003c/strong\u003e의 재사용 대기시간을 늘려 스킬 교환 후 빠르게 다음 교전을 시도하는 플레이를 견제합니다.\u003c/span\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e레벨 당 방어력 3.2 → \u003cstrong\u003e2.9\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e기적 실현(R)\u003c/span\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e쿨다운 80/70/60초 → \u003cstrong\u003e80/75/70초\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u0026nbsp;\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u003cstrong\u003e시셀라\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e시셀라는 무기군 간 지표 차이가 크게 벌어져 있습니다. 우수한 성능을 보이고 있는 투척 시셀라의 무기 숙련도 효과를 낮추고, 암기 시셀라의 무기 숙련도 효과를 상향하여 무기 간 성능 격차를 완화합니다.\u003c/span\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e투척 무기 숙련도 레벨 당 스킬 증폭 4.6% → \u003cstrong\u003e4.5%\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e암기 무기 숙련도 레벨 당 스킬 증폭 4% → \u003cstrong\u003e4.2%\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u0026nbsp;\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u003cstrong\u003e실비아\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e실비아는 낮은 피해량 지표를 기록하고 있습니다.\u003cstrong\u003e\u0026nbsp;E - 스페어휠\u003c/strong\u003e의 피해량을 높여 근접 교전에서의 위력을 보완합니다.\u003c/span\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e스페어휠(E)\u003c/span\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e최소 피해량 110/130/150/170/190(+스킬 증폭의 50%) → 110/130/150/170/190\u003cstrong\u003e(+스킬 증폭의 60%)\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e최대 피해량 242/286/330/374/418(+스킬 증폭의 110%) → 242/286/330/374/418\u003cstrong\u003e(+스킬 증폭의 132%)\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u0026nbsp;\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u003cstrong\u003e아드리아나\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e아드리아나는 높은 지표를 유지하고 있습니다.\u003cstrong\u003e\u0026nbsp;W - 기름 뿌리기\u003c/strong\u003e를 통한 지역 장악 및 원거리 견제 능력이 과도하다고 판단하여, 해당 스킬의 충전 시간을 늘려 사용 빈도를 조절합니다.\u003c/span\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e기름 뿌리기(W)\u003c/span\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e충전 시간 13/12.5/12/11.5/11초 → \u003cstrong\u003e14/13.5/13/12.5/12초\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u0026nbsp;\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u003cstrong\u003e아디나\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e지난 12.3 패치 이후 \u003cstrong\u003eE - 폴 디그니티\u003c/strong\u003e의 1타 피해량뿐만 아니라 2타 피해량까지 상향된 수치로 비정상 적용되던 문제를 수정합니다.\u003c/span\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e폴 디그니티(E)\u003c/span\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e2타 피해량이 잘못 적용되던 문제 수정\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u003cbr\u003e\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u003cstrong\u003e아비게일\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e아비게일의 \u003cstrong\u003eR - 디멘션 스트라이크\u003c/strong\u003e는 적중 난이도에 비해 다소 부족한 위력을 보이고 있습니다. 피해량과 둔화 지속 시간을 늘려 적중 시 결정력을 강화합니다.\u003c/span\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e디멘션 스트라이크(R)\u003c/span\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e피해량 150/275/400(+스킬 증폭의 85%) → 150/275/400\u003cstrong\u003e(+스킬 증폭의 95%)\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e이동 속도 감소 지속 시간 0.2초 → \u003cstrong\u003e0.3초\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u0026nbsp;\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u003cstrong\u003e아이솔\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e권총 아이솔은 지나치게 낮은 통계를 기록하고 있습니다.\u003cstrong\u003e\u0026nbsp;R - Mok제 폭탄\u003c/strong\u003e의 스킬 증폭 계수를 상향하여 적중 시의 리턴을 보완합니다.\u003c/span\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003eMok제 폭탄(R)\u003c/span\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e피해량 100/200/300(+공격력의 40%)(+스킬 증폭의 65%)(+대상 현재 체력의 12%) → 100/200/300(+공격력의 40%)\u003cstrong\u003e(+스킬 증폭의 70%)\u003c/strong\u003e(+대상 현재 체력의 12%)\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u0026nbsp;\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u003cstrong\u003e아이작\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e아이작은 약세가 지속되고 있습니다. 특히 피해량 지표에서 부족한 모습을 보이고 있어, \u003cstrong\u003eQ - 현장 급습\u003c/strong\u003e의 피해량 계수를 높여 진입 시의 파괴력을 끌어올립니다.\u003c/span\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e현장 급습(Q)\u003c/span\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e피해량 20/60/100/140/180(+공격력의 70%) → 20/60/100/140/180(\u003cstrong\u003e+공격력의 80%\u003c/strong\u003e)\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u0026nbsp;\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u003cstrong\u003e알렉스\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e알렉스는 높은 점수 획득량과 뛰어난 피해량 지표를 기록하고 있습니다. 특히 원거리 무기를 장착했을 때 \u003cstrong\u003eW - 타겟 마커\u003c/strong\u003e와\u003cstrong\u003e\u0026nbsp;\u003c/strong\u003e기본 공격으로 누적하는 피해량이 높다고 판단되어, 해당 스킬의 피해량 계수를 낮춰 위력을 견제합니다.\u003c/span\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e타겟 마커(원거리 W)\u003c/span\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e피해량 45/75/105/135/165(+공격력의 80%) → 45/75/105/135/165\u003cstrong\u003e(+공격력의 70%)\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u0026nbsp;\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u003cstrong\u003e에이든\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e에이든은 전반적인 지표에서 아쉬운 모습을 보이고 있습니다. \u003cstrong\u003eR - 낙뢰\u003c/strong\u003e의 외곽 적중 시 피해량과 2차 피해량을 높여 순간 화력과 광역 피해 능력을 일부 보완합니다.\u003c/span\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e낙뢰(R)\u003c/span\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e1차 낙뢰 피해량 60/90/120(+공격력의 75%) → \u003cstrong\u003e70/100/130(+공격력의 80%)\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e2차 낙뢰 피해량 70/115/160(+공격력의 80%) → 70/115/160\u003cstrong\u003e(+공격력의 90%)\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u0026nbsp;\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u0026nbsp;\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u003cstrong\u003e에키온\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e블랙맘바 에키온은 상위 구간에서 높은 성능을 보이고 있습니다. 뛰어난 내구도 및 기동성과 함께 피해량 측면에서도 높은 지표를 기록하고 있어, \u003cstrong\u003e블랙맘바 R - 독사의 진노\u003c/strong\u003e 피해량의 추가 체력 계수를 낮춰 위력을 하향합니다.\u003c/span\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003eVF 폭주(R)\u003c/span\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e독사의 진노[블랙맘바]\u003c/span\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e피해량 50/120/175/220(+공격력의 80%)(+추가 체력의 14%) → 50/120/160/200(+공격력의 80%)\u003cstrong\u003e(+추가 체력의 10%)\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003c/li\u003e\u003c/ul\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u0026nbsp;\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u003cstrong\u003e엠마\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e엠마는 상위 구간에서 높은 승률과 점수 획득량을 기록하고 있습니다. 특히 대응하기 어려운\u003cstrong\u003e\u0026nbsp;R - Change★\u003c/strong\u003e의 토끼 변이 지속 시간을 줄여 적을 일방적으로 무력화시키는 플레이를 견제합니다.\u003c/span\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003eChange★(R)\u003c/span\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e토끼\u003c/span\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e변이 지속 시간 1초 →\u003cstrong\u003e\u0026nbsp;0.9초\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003c/li\u003e\u003c/ul\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u0026nbsp;\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u003cstrong\u003e윌리엄\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e윌리엄은 대부분의 지표에서 높은 수치를 기록하고 있습니다. 야구공 회수 시의 기본 공격 화력이 과도하다고 판단되어, \u003cstrong\u003eP - 캐치볼\u003c/strong\u003e의 피해량 계수를 낮춰 위력을 조절합니다.\u003c/span\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e캐치볼(P)\u003c/span\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e피해량 (공격력의 110/117/124%) * (기본 공격 증폭) → \u003cstrong\u003e(공격력의 110/115/120%)\u003c/strong\u003e * (기본 공격 증폭)\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u0026nbsp;\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u003cstrong\u003e유민\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e유민은 평균 피해량이 낮아진 모습을 보이고 있습니다. \u003cstrong\u003eE - 경운\u003c/strong\u003e의 피해량을 높여 스킬을 공격적으로 활용했을 때의 위력을 보완합니다.\u003c/span\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e경운(E)\u003c/span\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e피해량 60/90/120/150/180(+스킬 증폭의 50%) → 60/90/120/150/180\u003cstrong\u003e(+스킬 증폭의 55%)\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u0026nbsp;\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u003cstrong\u003e이슈트반\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e이슈트반은 높은 순간 화력을 바탕으로 상위 구간에서 뛰어난 모습을 보이고 있습니다. \u003cstrong\u003eE - 경로 적분\u003c/strong\u003e의 방어력 감소 수치를 낮춰 적중 시 발생하는 과도한 연계 위력을 하향 조정합니다.\u003c/span\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e경로 적분(E)\u003c/span\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e방어력 감소 15% → \u003cstrong\u003e12%\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u0026nbsp;\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u003cstrong\u003e자히르\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e자히르는 매우 높은 승률과 점수 획득량을 기록하고 있습니다. 레벨 당 체력을 낮춰 게임 후반의 안정성을 견제합니다.\u003c/span\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e레벨 당 체력 79 → \u003cstrong\u003e76\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u0026nbsp;\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u003cstrong\u003e츠바메\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e츠바메는 대부분의 구간에서 높은 선택률과 뛰어난 지표를 유지하고 있습니다. 전반적인 성능을 견제하기 위해 레벨 당 체력과 공격력을 하향 조정합니다.\u003c/span\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e레벨 당 체력 75 → \u003cstrong\u003e73\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e레벨 당 공격력 4.6 → \u003cstrong\u003e4.4\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u0026nbsp;\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u003cstrong\u003e캐시\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e캐시는 높은 점수 획득량을 유지하고 있습니다. 적중 시 위력이 높은 \u003cstrong\u003eR - 이머전시 OP\u003c/strong\u003e의 피해량을 낮춰 과도한 광역 피해 능력을 조절합니다.\u003c/span\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e이머전시 OP(R)\u003c/span\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e최소 피해량 100/175/250(+스킬 증폭의 70%) → \u003cstrong\u003e100/160/220\u003c/strong\u003e(+스킬 증폭의 70%)\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e최대 피해량 200/350/500(+스킬 증폭의 140%) → \u003cstrong\u003e200/320/440\u003c/strong\u003e(+스킬 증폭의 140%)\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u0026nbsp;\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u003cstrong\u003e테오도르\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e테오도르는 피해량 지표가 낮게 나타나고 있습니다. \u003cstrong\u003eW - 증폭 스크린\u003c/strong\u003e의 피해량 계수를 높여 화력을 강화합니다.\u003c/span\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e증폭 스크린(W)\u003c/span\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e피해량 40/50/60/70/80(+스킬 증폭의 26%) → 40/50/60/70/80\u003cstrong\u003e(+스킬 증폭의 28%)\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u003cbr\u003e\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u003cstrong\u003e피올로\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e피올로는 피해량 측면에서 아쉬운 모습을 보이고 있습니다. \u003cstrong\u003eQ - 쌍절난격\u003c/strong\u003e의 피해량 계수를 소폭 상향하여 부족한 위력을 보완합니다.\u003c/span\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e쌍절난격\u0026amp;내려치기(Q)\u003c/span\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e쌍절난격(Q1) 피해량 8/16/24/32/40(+스킬 증폭의 14%) → 8/16/24/32/40\u003cstrong\u003e(+스킬 증폭의 15%)\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u0026nbsp;\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u003cstrong\u003e헤이즈\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e헤이즈는 전반적인 지표가 낮아진 모습을 보이고 있습니다. 주력 견제 스킬인 \u003cstrong\u003eQ - 40mm 유탄\u003c/strong\u003e의 피해량 계수를 높여 대치 상황에서의 위력을 강화합니다.\u003c/span\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e40mm 유탄(Q)\u003c/span\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e피해량 80/115/150/185/220(+스킬 증폭의 85%) → 80/115/150/185/220\u003cstrong\u003e(+스킬 증폭의 90%)\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u0026nbsp;\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u003cstrong\u003e현우\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e현우는 낮은 점수 획득량
