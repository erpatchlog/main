3cstrong\u003e헤이즈\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e돌격 소총 사용 시 받는 피해량 100% → \u003cstrong\u003e102%\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u003cbr\u003e\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u003cstrong\u003e헨리\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e암기 사용 시 받는 피해량 94% → \u003cstrong\u003e96%\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u003cbr\u003e\u003c/span\u003e\u003c/p\u003e\u003ch5 class=\"er-point-title\"\u003e버그 수정 및 개선 사항\u003c/h5\u003e\u003ch3\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u003cstrong\u003e\u003cspan style=\"font-size: 18px;\"\u003e게임 플레이 개선 사항\u003c/span\u003e\u003c/strong\u003e\u003c/span\u003e\u003c/h3\u003e\u003cul\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e팀원 슬롯의 궁극기 아이콘이 실험체별 아이콘 대신 공통 심볼로 표시되고, 쿨다운 잔여 시간이 부채꼴 게이지와 9초 이하 텍스트로 표시되도록 시인성 개선\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e관전 HUD의 팀원 궁극기 아이콘 표기를 팀원 슬롯과 동일하게 통일\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e관전 중 채팅창 라인 확장 단축키로 채팅창을 확장하고 이전 대화 내역을 스크롤로 확인할 수 있도록 개선\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e관전 중 확장맵에서 오브젝트 강조 표시 및 루미 동선 표기 기능을 사용할 수 있도록 개선\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e루미 및 키오스크에서 아직 구매할 수 없는 상품에 ALT + 좌클릭 핑 사용 시 상품이 준비되는 시점, 남은 쿨다운, 구매 불가 상태가 아군에게 시스템 채팅으로 안내되도록 개선\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e브리핑룸에서 루미아 섬 진입 시 사용하는 하이퍼루프 캡슐이 그림자 영역에서 어둡게만 표시되던 문제 개선\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e탈출한 플레이어가 특정 상황에서 사망 처리되는 문제 수정\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e게임 진행 중 서버와 연결이 종료되는 문제의 의심 코드 수정\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e일부 동적 이모티콘 사용 시 프레임 저하가 발생하는 문제 수정\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e임시 안전 지대 페이즈 승리 시 다른 지역에 있던 빈사 상태의 팀원이 아군 위치에서 부활하지 않는 문제 수정\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e관전 시 승리 연출 사운드가 출력되지 않는 문제 수정\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e이동 속도 감소 효과가 적용된 상태에서 예약 명령 기능이 동작하지 않는 문제 수정\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003eEMP 드론 무력화 시간이 잘못 적용된 문제 수정\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e전투 연구실에서 바람 큐브 획득 시 생성 위치에 이펙트가 출력되지 않는 문제 수정\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e전투 연구실 보상 상자 잠금 이펙트가 잘못된 위치에 출력되는 문제 수정\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e초재생 특성 회복량 증가 효과가 총 회복량이 아닌 개별 회복마다 적용되는 문제 수정\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e알파, 오메가가 휩쓸기 스킬 사용 시 충전 이펙트가 잘못된 위치에 출력되는 문제 수정\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e사이렌 배경 오브젝트가 동작하지 않는 문제 수정\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e일부 언어 환경에서 설치 아이템의 쿨다운 상태 텍스트가 출력되지 않는 문제 수정\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e일부 UI 단축키를 조합 단축키로 변경 시 표시 박스까지 함께 제거되는 문제 수정\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e특정 상황에서 게임 현황 UI가 비정상적으로 출력되는 문제의 의심 코드 수정\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e핑 도배 제한 텍스트에서 남은 시간의 단위가 출력되지 않는 문제 수정\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e코발트 프로토콜 리플레이가 정상적으로 재생되지 않는 문제 수정\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e코발트 프로토콜에서 플라즈마 대시 전술 스킬 인디케이터가 잘못 출력되는 문제 수정\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u003cbr\u003e\u003c/span\u003e\u003c/p\u003e\u003ch3\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u003cstrong\u003e\u003cspan style=\"font-size: 18px;\"\u003e실험체 및 무기 개선 사항\u003c/span\u003e\u003c/strong\u003e\u003c/span\u003e\u003c/h3\u003e\u003cul\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e승리 연출에서 잘못된 그림자 연출이 출력되는 문제 수정\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e돌격 소총 무기 스킬 과열(D) 중첩이 0인 상태에서 최초 기본 공격 시 중첩이 의도보다 많이 획득되는 문제 수정\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e투척 무기 스킬 연막(D) 1차 피해 이동 속도 감소량이 의도보다 낮게 적용되던 문제 수정\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u003cstrong\u003e니키\u003c/strong\u003e 일부 스킨 착용 중 가드(W) 모션이 잘못 출력되는 문제 수정\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e문제아 \u003cstrong\u003e니키\u003c/strong\u003e 스킨 착용 중 대기 상태에서 다리가 어색하게 출력되는 문제 수정\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e뒷골목 \u003cstrong\u003e니키\u003c/strong\u003e 스킨 로비 애니메이션 일부 모델링이 겹쳐서 출력되는 문제 수정\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e치어풀 펀치! \u003cstrong\u003e니키\u003c/strong\u003e 스킨 착용 중 탈출 연출에서 머리카락 밝기가 반복적으로 변하는 문제 수정\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u003cstrong\u003e다니엘\u003c/strong\u003e 영감(W) 피해가 방해 효과 면역 대상에게 적용되지 않는 문제 수정\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e비터스윗 \u003cstrong\u003e라우라\u003c/strong\u003e 스킨 착용 중 수직 발사 장치 (VLS) 활강 상태 애니메이션이 어색하게 출력되는 문제 수정\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u003cstrong\u003e레녹스\u003c/strong\u003e 위풍당당(P) 보호막 이펙트가 레녹스를 가리는 문제 수정\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u003cstrong\u003e루치아\u003c/strong\u003e 일부 스킬 툴팁 내 폰트 색상이 적용되지 않는 문제 수정\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u003cstrong\u003e마커스\u003c/strong\u003e 파괴(W) 에어본 상태 이상 적용 시 높이가 높게 적용되는 문제 수정\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e특정 상황에서 \u003cstrong\u003e매그너스\u003c/strong\u003e 휴식 중 폭주 바이크(R) 사용 시 이동 명령이 불가능한 문제 수정\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e코발트 프로토콜 상황실 및 아군 진영에서 \u003cstrong\u003e블레어\u003c/strong\u003e에게 기력 회복 효과가 적용되지 않는 문제 수정\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u003cstrong\u003e샬럿\u003c/strong\u003e 일부 스킨 착용 중 기적 실현(R) 스킬 바닥 이펙트가 어색하게 출력되는 문제 수정\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e특정 위치에서 \u003cstrong\u003e셀린\u003c/strong\u003e 빈 폭탄의 외형이 출력되지 않는 문제 수정\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e모란 뒤의 그림자 \u003cstrong\u003e쇼이치\u0026nbsp;\u003c/strong\u003e스킨 착용 중 비약(W) 이펙트가 최대 거리 기준으로 고정되어 출력되는 문제 수정\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e모란 뒤의 그림자 \u003cstrong\u003e쇼이치\u003c/strong\u003e 스킨 착용 중 일부 스킬 이펙트 각도가 어색하게 출력되는 문제 수정\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e특정 상황에서 \u003cstrong\u003e수아\u003c/strong\u003e 파랑새(W) 스킬이 아군에게 사용되는 문제 수정\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e해변가 \u003cstrong\u003e수아\u003c/strong\u003e 스킨 착용 중 무기 이펙트가 어색하게 출력되는 문제 수정\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u003cstrong\u003e알론소\u003c/strong\u003e 일부 스킨 착용 중 어트랙션 슬램!(E) 이펙트가 어색하게 출력되는 문제 수정\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u003cstrong\u003e얀\u003c/strong\u003e 쿼드라곤(R) 상태 아이콘 툴팁 내용이 실제 효과와 일치하지 않는 문제 수정\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u003cstrong\u003e에키온\u003c/strong\u003e 메마른 송곳니(E) 툴팁 중 VF 폭주 상태에서 적 처치 시 쿨다운 감소 관련 내용이 출력되지 않는 문제 수정\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e럭키 히어로 바니 \u003cstrong\u003e유스티나\u003c/strong\u003e 스킨 착용 중 연속 포격\u0026amp;섬멸 포격(Q) 사용 시 스킬 이펙트가 잘못 출력되는 문제 수정\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u003cstrong\u003e일레븐\u003c/strong\u003e 망치 무기 스킬 갑옷 깨기(D) 적중 시 일레븐 버거가 적중 대상 수보다 많이 생성되는 문제 수정\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u003cstrong\u003e키아라\u003c/strong\u003e 폭주(R) 범위 내에서 야생동물 처치 시 야생동물에 이펙트가 사라지지 않는 문제 수정\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e사관 후보생 \u003cstrong\u003e혜진\u003c/strong\u003e 스킨 착용 중 스킬 이펙트 색상이 진하게 출력되는 문제 수정\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e뒷골목 \u003cstrong\u003e히스이\u003c/strong\u003e 스킨 로비 애니메이션 점퍼 모델링이 어색하게 출력되는 문제 수정\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u003cbr\u003e\u003c/span\u003e\u003c/p\u003e\u003ch3\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u003cstrong\u003e\u003cspan style=\"font-size: 18px;\"\u003e로비 개선 사항\u003c/span\u003e\u003c/strong\u003e\u003c/span\u003e\u003c/h3\u003e\u003cul\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e상점, 패스, 컬렉션, 상자 보상 목록에 표시되는 이벤트 NP 아이템 이름에 기간(n일 / n시간)이 함께 표기되도록 개선\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003eER 패스 미구매 상태에서 ER 패스 보상 페이지에 처음 진입하거나 무료 보상을 획득할 때 ER 패스 구매 효과 안내 팝업이 출력되도록 추가\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e프로필 - 개요 및 리그 페이지에 정규 시즌 랭크 보상 수령에 필요한 게임 횟수와 현재 진행 횟수가 표시되도록 개선\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e이스포츠 스케줄러에서 우승팀이 발생한 경기의 팀 로고가 어두운 배경에 묻혀 보이던 문제 개선\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003eBGM High Light가 저작권 보호 모드 활성화 상태에서 재생되는 문제 수정\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e여러 개의 무기를 보유한 실험체 플레이 시 마지막으로 사용한 무기가 선택되지 않는 문제 수정\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e퀘스트 북의 판매 기간이 실제 판매 기간과 다르게 출력되는 문제 수정\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e일부 시즌 정보가 잘못 출력되는 문제 수정\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e특정 상황에 프로필 아이콘 변경 시 팀 슬롯 배경이 해제되는 문제 수정\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e특정 상황에서 매칭 시도 시 에러가 발생하며 매칭 진행이 불가능한 문제 수정\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e상점에서 드롭스 재화 정보와 메뉴 UI가 겹쳐서 출력되는 문제 수정\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e제작소에서 아이템 잠금 설정 후 잠금 표시가 갱신되지 않는 문제 수정\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e제작소에서 제작한 아이템이 즉시 목록에서 제거되지 않는 문제 수정\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e보관함 취소 버튼에 잠금 아이콘이 표시되는 문제 수정\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e보관함 \u0026gt; 기타 탭에서 잠긴 아이템 선택 시 저장 후 나가기 버튼이 활성화되는 문제 수정\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e보관함 \u0026gt; 이모티콘 탭의 저장 버튼 텍스트가 중앙 정렬되어 있지 않은 문제 수정\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e팀 로비에서 이스포츠 스케쥴러 팝업 종료 시 메뉴 부분이 잘못 표시되는 문제 수정\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e일본어 언어 환경에서 게임 결과 화면의 시즌 조각 포인트 획득 텍스트가 포인트 영역과 겹쳐서 출력되는 문제 수정\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e로비 메뉴에 마우스 오버 시 주황색 또는 파란색 이펙트가 강하게 출력되는 문제 수정\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e관찰일지 정렬 순서 변경 값이 저장되지 않는 문제 수정\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e확장 미니맵 - 아이콘 확대 기능 사용 옵션명에 미니맵 적용 여부가 누락되어 있던 문제 수정\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e특정 상황에서 신규 캐릭터 및 스킨 획득 시 획득 연출 이미지가 하단으로 치우쳐 출력되는 문제 수정\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\n            \u003c/div\u003e","date":"2026-09-16T08:00:00.000000Z","thumb":"https://cdn.playeternalreturn.com/upload/2026/09/16/hlka1er53fwFJGUfZGaXxATpiKQfJ5WsX1DoQ221.png","title":"2026.09.17 - 12.4 패치노트","url":"https://playeternalreturn.com/posts/news/3838"}];
</script>
<script>
const GD = window.ER_GAMEDATA || { characters: [], items: [] };
const PATCHES = (window.ER_PATCHES || []).slice().sort((a, b) => b.id - a.id);
const $ = (s, r = document) => r.querySelector(s);
const clean = s => (s || '').replace(/ /g, ' ').replace(/\s+/g, ' ').trim();
const norm = s => clean(s).replace(/\s/g, '');
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

const charMap = new Map(GD.characters.map(c => [norm(c.name), c]));
const itemsByLen = GD.items.slice().sort((a, b) => b.name.length - a.name.length);

const KIND = { buff: '버프', nerf: '너프', adjust: '조정' };
const ITEM_SECTIONS = ['무기', '방어구', '아이템', '소모품'];
const UPDATE_GROUPS = [
  ['신규 실험체', t => /신규 실험체/.test(t)],
  ['신규 아이템', t => /아이템/.test(t)],
  ['스킨', t => /스킨|이모티콘/.test(t)],
  ['시스템', t => /시스템|매치/.test(t)],
  ['특성 · 스킬', t => /특성|전술 스킬|무기 스킬/.test(t)],
  ['버그 수정', t => /버그/.test(t)],
  ['기타', () => true],
];

// ---------------- 파싱 ----------------
function splitSections(html) {
  const root = new DOMParser().parseFromString(`<div id="root">${html}</div>`, 'text/html').getElementById('root');
  root.querySelectorAll('[style],[class]').forEach(e => { e.removeAttribute('style'); e.removeAttribute('class'); });
  const sections = [];
  let cur = { title: '개요', nodes: [] };
  for (const n of root.children) {
    if (n.tagName === 'H5') { sections.push(cur); cur = { title: clean(n.textContent), nodes: [] }; }
    else cur.nodes.push(n);
  }
  sections.push(cur);
  return sections;
}

function isEmpty(n) { return !clean(n.textContent) && !n.querySelector('img, table'); }

// <p><strong>이름</strong></p> 처럼 굵은 글씨만 있는 짧은 줄
function boldOnly(n) {
  if (/^H[1-4]$/.test(n.tagName)) return clean(n.textContent).length <= 30;
  if (n.tagName !== 'P') return false;
  const s = n.querySelector('strong, b');
  const t = clean(n.textContent);
  return !!s && t === clean(s.textContent) && t.length <= 30;
}

// 하위 목록을 뺀 li 자신의 텍스트
function ownText(li) {
  const c = li.cloneNode(true);
  c.querySelectorAll('ul, ol').forEach(x => x.remove());
  return clean(c.textContent);
}

function leafLines(lists) {
  const out = [];
  for (const l of lists) l.querySelectorAll('li').forEach(li => { const t = ownText(li); if (t) out.push(t); });
  return out;
}

function findChar(name) {
  const n = norm(name);
  return charMap.get(n) || GD.characters.find(c => n.startsWith(norm(c.name)));
}

function matchItem(text) {
  for (const it of itemsByLen) {
    if (text.startsWith(it.name)) {
      const next = text[it.name.length];
      if (next === undefined || /[\s(\[-]/.test(next)) return it;
    }
  }
  return null;
}

// ---------------- 버프/너프 분류 ----------------
// 버프: 공격력·스킬 증폭·피해량 등 증가, 쿨타임 감소
// 너프: 공격력·스킬 증폭·피해량 등 감소, 쿨타임 증가
// 조정: 어떤 수치는 오르고 어떤 수치는 내림 (스킬끼리 엇갈림, 초반↑ 후반↓ 등)
const BUFF_WORDS = /상향|강화|늘리|늘려|늘어|높이|높여|높아지|증가시|보완/g;
const NERF_WORDS = /하향|낮추|낮춰|줄이|줄여|덜어|약화/g;
// 숫자가 작을수록 좋은 항목 (쿨타임, 소모량 등). '쿨다운 감소'처럼 '감소'가 붙으면 클수록 좋음
const LOWER_BETTER = /쿨다운|쿨타임|재사용 대기|대기 시간|소모|비용|시전 시간|필요|누적량|지연|받는 피해|받는 스킬 피해/;
// 증감만으로 좋고 나쁨을 단정하기 애매한 항목 → 수치가 바뀌면 조정
const AMBIGUOUS = /대신 받는 피해/;

// 한 줄(A → B)의 변화: 'buff' | 'nerf' | 'adjust' | null(수치 비교 불가)
function lineScore(line) {
  if (!line.includes('→')) {
    if (/\(신규\)|추가됩니다|새로 추가/.test(line)) return 'buff';
    if (/\(삭제\)|삭제됩니다|제거됩니다/.test(line)) return 'nerf';
    return null;
  }
  const i = line.indexOf('→');
  const a = (line.slice(0, i).match(/\d+(?:\.\d+)?/g) || []).map(Number);
  const b = (line.slice(i + 1).match(/\d+(?:\.\d+)?/g) || []).map(Number);
  const k = Math.min(a.length, b.length);
  let up = 0, down = 0;
  for (let j = 1; j <= k; j++) {   // 앞쪽에 항목 이름 속 숫자(예: '2타')가 섞일 수 있어 뒤에서부터 맞춰 비교
    const x = a[a.length - j], y = b[b.length - j];
    if (y > x) up++; else if (y < x) down++;
  }
  if (up && down) return 'adjust';   // 레벨별 수치가 엇갈림 (초반↑ 후반↓ 또는 기본↑ 계수↓)
  if (!up && !down) return null;
  const label = line.slice(0, i);
  if (AMBIGUOUS.test(label)) return 'adjust';
  const lowerBetter = LOWER_BETTER.test(label) && !/감소|감속/.test(label);
  return (up > 0) !== lowerBetter ? 'buff' : 'nerf';
}

function classify(desc, lines) {
  const r = lines.map(lineScore).filter(Boolean);
  if (r.length) {
    if (r.includes('adjust') || (r.includes('buff') && r.includes('nerf'))) return 'adjust';
    return r.includes('buff') ? 'buff' : 'nerf';
  }
  // 수치 변화가 없는 경우(메커니즘 변경 등)만 개발자 코멘트로 판단
  const b = (desc.match(BUFF_WORDS) || []).length;
  const n = (desc.match(NERF_WORDS) || []).length;
  if (b && !n) return 'buff';
  if (n && !b) return 'nerf';
  return 'adjust';
}

// 상세 화면에서 줄마다 ▲▼◆ 표시를 붙이기 위해 li 에 결과를 기록
function markLines(list) {
  list.querySelectorAll('li').forEach(li => { const s = lineScore(ownText(li)); if (s) li.dataset.s = s; });
}

// ---------------- 실험체 ----------------
function parseChars(sections) {
  const list = [];
  for (const sec of sections) {
    let cur = null;
    for (const n of sec.nodes) {
      if (isEmpty(n)) continue;
      if (boldOnly(n)) {
        const name = clean(n.textContent);
        cur = { name, info: findChar(name), desc: [], lists: [] };
        list.push(cur);
        continue;
      }
      if (!cur) continue;
      if (n.tagName === 'UL' || n.tagName === 'OL') cur.lists.push(n);
      else cur.desc.push(clean(n.textContent));
    }
  }
  for (const c of list) {
    c.lists.forEach(markLines);
    c.kind = classify(c.desc.join(' '), leafLines(c.lists));
  }
  return list;
}

// ---------------- 아이템 ----------------
function parseItems(sections) {
  const map = new Map();
  const add = (name, info, cat, rest, nested) => {
    let it = map.get(name);
    if (!it) { it = { name, info, cat, lines: [], html: '' }; map.set(name, it); }
    if (rest) {
      const s = lineScore(rest);
      it.lines.push(rest);
      it.html += `<li${s ? ` data-s="${s}"` : ''}><p>${esc(rest)}</p></li>`;
    }
    if (nested) { markLines(nested); it.lines.push(...leafLines([nested])); it.html += nested.innerHTML; }
  };
  const handleLi = (li, cat) => {
    const own = ownText(li);
    const nested = li.querySelector(':scope > ul, :scope > ol');
    const m = matchItem(own);
    if (m) return add(m.name, m, cat, clean(own.slice(m.name.length)), nested);
    if (nested && [...nested.children].some(c => matchItem(ownText(c)))) {
      for (const c of nested.children) handleLi(c, own);   // 무기 종류 등 분류 줄
      return;
    }
    add(own, null, cat, '', nested);
  };
  for (const sec of sections) {
    let cat = sec.title;
    for (const n of sec.nodes) {
      if (isEmpty(n)) continue;
      if (boldOnly(n)) cat = clean(n.textContent);
      else if (n.tagName === 'UL' || n.tagName === 'OL') for (const li of n.children) handleLi(li, cat);
    }
  }
  const list = [...map.values()];
  for (const it of list) it.kind = classify('', it.lines);
  return list;
}

function parsePatch(p) {
  const sections = splitSections(p.html).filter(s => !/코발트/.test(s.title));
  const charSecs = [], itemSecs = [], updSecs = [];
  for (const s of sections) {
    if (s.title === '실험체') charSecs.push(s);
    else if (ITEM_SECTIONS.includes(s.title)) itemSecs.push(s);
    else if (s.nodes.some(n => !isEmpty(n))) updSecs.push(s);
  }
  return { chars: parseChars(charSecs), items: parseItems(itemSecs), updates: updSecs };
}

// ---------------- 화면 ----------------
let current = null, tab = 'update';
try { tab = localStorage.getItem('er-tab') || 'update'; } catch (e) {}

// 카드 상단 요약: 하위 제목(h3/h4)과 등급이 붙은 스킨 이름
function chipsHtml(sec) {
  const names = [];
  for (const n of sec.nodes) {
    if (/^H[34]$/.test(n.tagName)) names.push(clean(n.textContent));
    n.querySelectorAll && n.querySelectorAll('strong').forEach(s => {
      const t = clean(s.textContent);
      if (/\((일반|고급|희귀|영웅|전설|신화)\)$/.test(t)) names.push(t);
    });
  }
  const uniq = [...new Set(names.filter(Boolean))];
  return uniq.length ? `<div class="chips">${uniq.map(t => `<span class="chip">${esc(t)}</span>`).join('')}</div>` : '';
}

function renderUpdates(secs) {
  if (!secs.length) return '<p class="empty">업데이트 내용이 없습니다.</p>';
  const groups = UPDATE_GROUPS.map(([name]) => ({ name, secs: [] }));
  for (const s of secs) {
    const gi = s.title === '개요' ? groups.length - 1 : UPDATE_GROUPS.findIndex(([, f]) => f(s.title));
    groups[gi].secs.push(s);
  }
  return groups.filter(g => g.secs.length).map(g => `
    <section class="ugroup"><h2>${esc(g.name)}</h2>
      ${g.secs.map(s => `<details class="card" open><summary>${esc(s.title)}</summary>
        ${chipsHtml(s)}<div class="body">${s.nodes.filter(n => !isEmpty(n)).map(n => n.outerHTML).join('')}</div></details>`).join('')}
    </section>`).join('');
}

function iconHtml(entry, type, idx) {
  const info = entry.info;
  const grade = type === 'item' && info ? ` grade-${info.grade}` : '';
  const inner = info
    ? `<img src="${esc(info.img)}" alt="${esc(entry.name)}" loading="lazy" onerror="this.outerHTML='<div class=noimg>${esc(entry.name).replace(/'/g, '')}</div>'">`
    : `<div class="noimg">${esc(entry.name)}</div>`;
  return `<button class="icon ${type}${grade}" data-idx="${idx}" title="${esc(entry.name)}">${inner}</button>`;
}

function renderGrid(list, type, label) {
  if (!list.length) return `<p class="empty">이번 패치에는 ${label} 변경 사항이 없습니다.</p>`;
  return `<p class="hint">${type === 'char' ? '초상화를' : '아이템을'} 클릭하면 패치 내용이 아래에 표시됩니다. · 이미지 출처: <a href="https://dak.gg/er" target="_blank" rel="noopener">DAK.GG</a></p>` +
    ['buff', 'nerf', 'adjust'].map(k => {
      const idxs = list.map((e, i) => e.kind === k ? i : -1).filter(i => i >= 0);
      if (!idxs.length) return '';
      return `<section class="group ${k}"><h2>${KIND[k]}<small>${idxs.length}</small></h2>
        <div class="grid">${idxs.map(i => iconHtml(list[i], type, i)).join('')}</div>
        <div class="detail" hidden></div></section>`;
    }).join('');
}

function detailHtml(e, type) {
  const meta = type === 'item' && e.cat ? `<div class="meta">${esc(e.cat)}</div>` : '';
  const desc = type === 'char' ? e.desc.map(d => `<p class="desc">${esc(d)}</p>`).join('') : '';
  const body = type === 'char' ? e.lists.map(l => l.outerHTML).join('') : `<ul>${e.html}</ul>`;
  return `<h3>${esc(e.name)}<span class="badge ${e.kind}">${KIND[e.kind]}</span></h3>${meta}${desc}${body}`;
}

function bindGrid(list, type) {
  const main = $('#main');
  main.addEventListener('click', ev => {
    const btn = ev.target.closest('.icon');
    if (!btn) return;
    const was = btn.classList.contains('selected');
    main.querySelectorAll('.icon.selected').forEach(b => b.classList.remove('selected'));
    main.querySelectorAll('.detail').forEach(d => { d.hidden = true; d.innerHTML = ''; });
    if (was) return;
    btn.classList.add('selected');
    const box = btn.closest('.group').querySelector('.detail');
    box.innerHTML = detailHtml(list[+btn.dataset.idx], type);
    box.hidden = false;
  });
}

function render() {
  document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('on', b.dataset.tab === tab));
  const old = $('#main'), main = old.cloneNode(false);   // 이전 클릭 리스너 제거
  old.replaceWith(main);
  if (!current) {
    // 첫 실행: 수집기가 데이터를 만들 때까지 5초마다 새로고침 (최대 약 2분)
    const tries = +(location.hash.match(/r=(\d+)/) || [0, 0])[1];
    if (tries < 24) {
      main.innerHTML = '<p class="empty">패치노트를 가져오는 중입니다… (첫 실행 시 30초 정도 걸립니다)</p>';
      setTimeout(() => { location.hash = 'r=' + (tries + 1); location.reload(); }, 5000);
    } else {
      main.innerHTML = '<p class="empty">아직 수집된 패치노트가 없습니다.<br>인터넷 연결을 확인한 뒤 트레이의 ER 아이콘 → "지금 확인"을 눌러 주세요.</p>';
    }
    return;
  }
  const d = current.parsed;
  if (tab === 'update') main.innerHTML = renderUpdates(d.updates);
  if (tab === 'chars') { main.innerHTML = renderGrid(d.chars, 'char', '실험체'); bindGrid(d.chars, 'char'); }
  if (tab === 'items') { main.innerHTML = renderGrid(d.items, 'item', '아이템'); bindGrid(d.items, 'item'); }
}

function selectPatch(id) {
  current = PATCHES.find(p => p.id === id) || null;
  if (current && !current.parsed) current.parsed = parsePatch(current);
  $('#orig').href = current ? current.url : '#';
  const counts = current ? [current.parsed.updates.length, current.parsed.chars.length, current.parsed.items.length] : [0, 0, 0];
  document.querySelectorAll('#tabs button span').forEach((s, i) => s.textContent = counts[i] || '');
  render();
}

const sel = $('#patchSel');
sel.innerHTML = PATCHES.map(p => `<option value="${p.id}">${esc(p.title)} (${p.date.slice(0, 10)})</option>`).join('');
sel.addEventListener('change', () => selectPatch(+sel.value));
$('#tabs').addEventListener('click', ev => {
  const b = ev.target.closest('button');
  if (!b) return;
  tab = b.dataset.tab;
  try { localStorage.setItem('er-tab', tab); } catch (e) {}
  render();
});
selectPatch(PATCHES.length ? PATCHES[0].id : 0);
</script>
