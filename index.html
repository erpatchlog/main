u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u003cbr\u003e\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u003cstrong\u003e세레스 이모티콘 패키지\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e신규 세레스 이모티콘 4종을 할인된 가격으로 구매할 수 있는 기간 패키지가 출시됩니다.\u003c/span\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e판매 가격: \u003cdel\u003e800 NP\u003c/del\u003e → \u003cstrong\u003e480 NP\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e구성품: 세레스 이모티콘 4종, XP 부스트 (1일)\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e판매 기간: \u003cstrong\u003e10월 1일\u003c/strong\u003e(목) 점검 후 ~ \u003cstrong\u003e10월 15일\u003c/strong\u003e(목) 점검 전까지\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e※ 기존 보유하고 있는 상품에 따라 구매 가격이 변경됩니다.\u003cbr\u003e※ 구매 즉시 사용되는 부스트가 포함된 상품은 청약철회가 불가합니다.\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u003cbr\u003e\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u003cstrong\u003e시즌 12 프리미엄/베이직 토큰 북 II 안내\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e10월 1일(목) 점검 후 시즌 12 프리미엄/베이직 토큰 북의 판매 및 이용이 종료되고, 미션을 통해 세일링 토큰을 획득할 수 있는 \u003cstrong\u003e시즌 12 프리미엄/베이직 토큰 북 II\u003c/strong\u003e가 판매됩니다.\u003c/span\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e판매 기간: 2026년 10월 1일(목) 점검 후 ~ 2026년 11월 12일(목) 점검 전까지\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e이용(보상 획득) 기간: 2026년 11월 26일(목) 점검 전까지\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e시즌 12 프리미엄 토큰 북 II\u003c/span\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e판매 가격: 1,500 NP\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e상세 구성: 15레벨 퀘스트 북, 세일링 토큰 최대 75개 획득 가능\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e시즌 12 베이직 토큰 북 II\u003c/span\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e판매 가격: 10,000 A-Coin\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e상세 구성: 10레벨 퀘스트 북, 세일링 토큰 최대 25개 획득 가능\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e※ 상세 퀘스트 내용은 인게임 퀘스트 북 메뉴에서 확인하실 수 있습니다.\u003cbr\u003e※ 미션을 완료했으나 보상을 수령하지 않은 경우, 점검 후 우편함으로 자동 지급되며 2주 이내 접속 시 수령 가능합니다.\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u003cbr\u003e\u003c/span\u003e\u003c/p\u003e\u003ch3\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u003cstrong\u003e\u003cspan style=\"font-size: 18px;\"\u003e시즌 12 코발트 유니온 대전 종료\u003c/span\u003e\u003c/strong\u003e\u003c/span\u003e\u003c/h3\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e시즌 12 코발트 유니온 대전이 종료됩니다. 참여해주신 분들께 감사드립니다.\u003c/span\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e시즌 12 코발트 유니온 대전 종료 시간: 2026년 09월 30일 23:59 (KST) 입장 게임까지\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e루미아 유니온과 코발트 유니온 보상은 별도로 지급되며, 티어별 보상은 2026년 11월 19일(목) 점검 후 지급됩니다. 자세한 보상 내역은 12.4.0 패치노트를 참고해 주세요.\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u003cbr\u003e\u003c/span\u003e\u003c/p\u003e\u003ch5 class=\"er-point-title\"\u003e시스템\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u003cbr\u003e\u003c/span\u003e\u003c/h5\u003e\u003ch3\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u003cstrong\u003e\u003cspan style=\"font-size: 18px;\"\u003eNP 구매 스탬프\u003c/span\u003e\u003c/strong\u003e\u003c/span\u003e\u003c/h3\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003eNP 상품을 구매할 때마다 추가 혜택을 받을 수 있는 NP \u003cstrong\u003e구매 스탬프\u003c/strong\u003e 시스템이 추가됩니다.\u003c/span\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003eNP 상품을 구매하면 \u003cstrong\u003e스탬프 1개\u003c/strong\u003e를 획득하며, 스탬프는 획득 즉시 자동으로 사용됩니다.\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e스탬프를 획득할 때마다 보너스 보상 목록에서 아이템 1개가 확률적으로 지워집니다.\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e스탬프를 \u003cstrong\u003e4개\u003c/strong\u003e 모으면 남아 있는 보상 중 1개를 확률적으로 획득하고, 보상 목록이 초기화됩니다.\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e스탬프는 구매한 상품에 따라 \u003cstrong\u003e블루 스탬프\u003c/strong\u003e와 \u003cstrong\u003e퍼플 스탬프\u003c/strong\u003e로 나뉘며, 각 스탬프에 따라 지울 그룹이 나뉩니다.\u003c/span\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e블루 스탬프는 더 높은 가치의 보상 그룹 내 1개를 지우며, 퍼플 스탬프는 더 낮은 가치의 보상 그룹 내 1개를 지울 수 있습니다.\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e보너스 보상 구성\u003c/span\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e블루 스탬프 그룹\u003c/span\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003eA-Coin 1,500 / A-Coin 3,000 / A-Coin 5,000 / 20 마일리지 / 300 무료 NP\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e퍼플 스탬프 그룹\u003c/span\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003eA-Coin 100 / A-Coin 300 / A-Coin 500 / 5 마일리지 / 100 무료 NP\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003c/li\u003e\u003c/ul\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e현재 스탬프 진행 상황과 남은 보상은 상점 상단의 \u003cstrong\u003e스탬프\u003c/strong\u003e 메뉴에서 확인할 수 있습니다.\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cimg src=\"https://cdn.playeternalreturn.com/2026%2F09%2F30%2F1790744704997-03.+NP+%EC%8A%A4%ED%83%AC%ED%94%84.gif\" class=\"fr-fil fr-dib fr-draggable\" style=\"box-sizing: border-box; margin: 5px auto 5px 0px; padding: 0px; border: 0px; font-style: normal; font-variant-ligatures: normal; font-variant-caps: normal; font-variant-numeric: inherit; font-variant-east-asian: inherit; font-variant-alternates: inherit; font-variant-position: inherit; font-variant-emoji: inherit; font-weight: 400; font-stretch: inherit; font-size: 16px; line-height: inherit; font-family: sans-serif; font-optical-sizing: inherit; font-size-adjust: inherit; font-kerning: inherit; font-feature-settings: inherit; font-variation-settings: inherit; font-language-override: inherit; vertical-align: top; cursor: pointer; position: relative; max-width: 100%; display: block; float: none; text-align: left; color: rgb(174, 197, 203); letter-spacing: normal; orphans: 2; text-indent: 0px; text-transform: none; widows: 2; word-spacing: 0px; -webkit-text-stroke-width: 0px; white-space: normal; background-color: rgb(14, 14, 15); text-decoration-thickness: initial; text-decoration-style: initial; text-decoration-color: initial;\"\u003e\u003cbr\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u003cem\u003e※\u0026nbsp;\u003c/em\u003e보너스 보상 획득 확률은 별도의 웹 페이지\u003ca href=\"https://support.playeternalreturn.com/hc/articles/62389061560857\"\u003e[바로가기]\u003c/a\u003e 에서 확인할 수 있습니다.\u003cbr\u003e\u003cem\u003e※ 청약철회 시 해당 결제로 획득한 스탬프와 보너스 보상은 회수됩니다.\u003c/em\u003e\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u003cbr\u003e\u003c/span\u003e\u003c/p\u003e\u003ch3\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u003cstrong\u003e\u003cspan style=\"font-size: 18px;\"\u003e유저 차단 기능\u003c/span\u003e\u003c/strong\u003e\u003c/span\u003e\u003c/h3\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e원치 않는 유저의 반복적인 친구 요청이나 팀 초대, 귓속말을 직접 끊어낼 수 있도록 \u003cstrong\u003e유저 차단\u003c/strong\u003e 기능이 추가됩니다. 기존에는 옵션에서 친구 요청이나 팀 초대를 일괄로 막아야 했지만, 이제는 피하고 싶은 상대만 선택해 차단할 수 있습니다.\u003c/span\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e친구 목록 메뉴의 이름이 \u003cstrong\u003e커뮤니티\u003c/strong\u003e로 변경되고, 상단에 \u003cstrong\u003e친구 목록\u003c/strong\u003e / \u003cstrong\u003e차단 목록\u003c/strong\u003e 탭이 추가됩니다.\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e친구 상세 정보 팝업, 게임 결과 통계 화면, 프로필의 대전 기록 순위표에서 \u003cstrong\u003e[차단하기]\u003c/strong\u003e 버튼으로 유저를 차단할 수 있습니다. 차단 목록에서는 \u003cstrong\u003e[차단 해제]\u003c/strong\u003e가 가능합니다.\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e차단한 유저와는 서로 친구 요청, 팀 초대, 귓속말을 보내거나 받을 수 없습니다. 이미 친구인 유저를 차단하면 친구 관계가 해제된 뒤 차단됩니다.\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e차단 사실은 상대에게 알리지 않으며, 차단한 유저는 팀 로비의 초대 가능한 친구 목록에도 표시되지 않습니다.\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e차단은 최대 \u003cstrong\u003e50명\u003c/strong\u003e까지 등록할 수 있습니다.\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cimg src=\"https://cdn.playeternalreturn.com/2026%2F09%2F30%2F1790744720439-04.+%EC%B0%A8%EB%8B%A8+%EA%B8%B0%EB%8A%A5.gif\" class=\"fr-fil fr-dib fr-draggable\" style=\"box-sizing: border-box; margin: 5px auto 5px 0px; padding: 0px; border: 0px; font-style: normal; font-variant-ligatures: normal; font-variant-caps: normal; font-variant-numeric: inherit; font-variant-east-asian: inherit; font-variant-alternates: inherit; font-variant-position: inherit; font-variant-emoji: inherit; font-weight: 400; font-stretch: inherit; font-size: 16px; line-height: inherit; font-family: sans-serif; font-optical-sizing: inherit; font-size-adjust: inherit; font-kerning: inherit; font-feature-settings: inherit; font-variation-settings: inherit; font-language-override: inherit; vertical-align: top; cursor: pointer; position: relative; max-width: 100%; display: block; float: none; text-align: left; color: rgb(174, 197, 203); letter-spacing: normal; orphans: 2; text-indent: 0px; text-transform: none; widows: 2; word-spacing: 0px; -webkit-text-stroke-width: 0px; white-space: normal; background-color: rgb(14, 14, 15); text-decoration-thickness: initial; text-decoration-style: initial; text-decoration-color: initial;\"\u003e\u003cbr\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u003cem\u003e※ 차단 기능은 1:1 요청 수단에만 적용되며, 게임 매칭이나 인게임·전략맵 채팅은 차단되지 않습니다.\u003c/em\u003e\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u003cbr\u003e\u003c/span\u003e\u003c/p\u003e\u003ch3\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u003cstrong\u003e\u003cspan style=\"font-size: 18px;\"\u003e키오스크 우선 구매 재료 안내\u003c/span\u003e\u003c/strong\u003e\u003c/span\u003e\u003c/h3\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e키오스크와 루미 특수 상점에서 어떤 특수 재료를 먼저 구매해야 하는지 바로 판단할 수 있도록, 특수 상점 UI에 안내 기능이 추가됩니다.\u003c/span\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e루트 목표 아이템의 가장 왼쪽 아이템 제작에 필요한 특수 재료 슬롯의 좌측 상단에 노란 삼각형이 표시됩니다.\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e해당 슬롯에 마우스를 올리면 슬롯 상단에 해당 재료로 완성할 아이템 아이콘이 표시됩니다.\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e루트 목표 아이템의 가장 왼쪽 아이템이 전술 강화 모듈인 경우, 모듈 슬롯에 현재 전술 스킬 아이콘과 레벨이 표시됩니다.\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e목표 아이템 제작을 완료하거나 재료를 모두 보유하면 다음 목표 아이템 기준으로 즉시 갱신됩니다.\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e해당 기능은 옵션 → 게임 → 세부 설정의 \u003cstrong\u003e[키오스크 우선 구매 특수 재료 강조 표시]\u003c/strong\u003e에서 켜고 끌 수 있으며, 기본값은 On입니다.\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u003cimg src=\"https://cdn.playeternalreturn.com/2026%2F09%2F30%2F1790744735441-05.+%ED%82%A4%EC%98%A4%EC%8A%A4%ED%81%AC+%EC%9A%B0%EC%84%A0+%EA%B5%AC%EB%A7%A4+%EC%9E%AC%EB%A3%8C+%EC%88%98%EC%A0%95.gif\" class=\"fr-fil fr-dib fr-draggable\" style=\"box-sizing: border-box; margin: 5px auto 5px 0px; padding: 0px; border: 0px; font-style: normal; font-variant-ligatures: normal; font-variant-caps: normal; font-variant-numeric: inherit; font-variant-east-asian: inherit; font-variant-alternates: inherit; font-variant-position: inherit; font-variant-emoji: inherit; font-weight: 400; font-stretch: inherit; font-size: 16px; line-height: inherit; font-family: sans-serif; font-optical-sizing: inherit; font-size-adjust: inherit; font-kerning: inherit; font-feature-settings: inherit; font-variation-settings: inherit; font-language-override: inherit; vertical-align: top; cursor: pointer; position: relative; max-width: 100%; display: block; float: none; text-align: left; color: rgb(174, 197, 203); letter-spacing: normal; orphans: 2; text-indent: 0px; text-transform: none; widows: 2; word-spacing: 0px; -webkit-text-stroke-width: 0px; white-space: normal; background-color: rgb(14, 14, 15); text-decoration-thickness: initial; text-decoration-style: initial; text-decoration-color: initial;\"\u003e \u003cbr\u003e\u003c/span\u003e\u003c/p\u003e\u003ch3\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u003cstrong\u003e\u003cspan style=\"font-size: 18px;\"\u003e인게임 플로팅 텍스트 노출 설정\u003c/span\u003e\u003c/strong\u003e\u003c/span\u003e\u003c/h3\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e인게임에 표시되는 정보량을 직접 조절할 수 있도록, 설정 - 게임 탭에 \u003cstrong\u003e텍스트 노출 설정\u003c/strong\u003e 항목이 추가됩니다. 아래 플로팅 텍스트를 항목별로 켜고 끌 수 있으며, 기본값은 모두 켜짐입니다.\u003c/span\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e크레딧 획득\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e입힌 피해\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e받은 피해\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e체력 회복\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e무기 숙련도 경험치\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e방어 숙련도 경험치\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e사냥 숙련도 경험치\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e제작 숙련도 경험치\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e탐색 숙련도 경험치\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e이동 숙련도 경험치\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e숙련도 레벨업\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e폭발 타이머 회복\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e가젯 포인트 획득\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u003cem\u003e※ 설정은 관전 및 리플레이에도 동일하게 적용됩니다.\u003c/em\u003e\u003c/span\u003e\u003c/p\u003e\u003ch3\u003e\u003cimg src=\"https://cdn.playeternalreturn.com/2026%2F09%2F30%2F1790744752561-06.+%EC%9D%B8%EA%B2%8C%EC%9E%84+%ED%94%8C%EB%A1%9C%ED%8C%85+%ED%85%8D%EC%8A%A4%ED%8A%B8+%EB%85%B8%EC%B6%9C+%EC%84%A4%EC%A0%95.gif\" class=\"fr-fil fr-dib fr-draggable\" style=\"box-sizing: border-box; margin: 5px auto 5px 0px; padding: 0px; border: 0px; font-style: normal; font-variant-ligatures: normal; font-variant-caps: normal; font-variant-numeric: inherit; font-variant-east-asian: inherit; font-variant-alternates: inherit; font-variant-position: inherit; font-variant-emoji: inherit; font-weight: 400; font-stretch: inherit; font-size: 16px; line-height: inherit; font-family: sans-serif; font-optical-sizing: inherit; font-size-adjust: inherit; font-kerning: inherit; font-feature-settings: inherit; font-variation-settings: inherit; font-language-override: inherit; vertical-align: top; cursor: pointer; position: relative; max-width: 100%; display: block; float: none; text-align: left; color: rgb(255, 255, 255); letter-spacing: normal; orphans: 2; text-indent: 0px; text-transform: none; widows: 2; word-spacing: 0px; -webkit-text-stroke-width: 0px; white-space: normal; background-color: rgb(14, 14, 15); text-decoration-thickness: initial; text-decoration-style: initial; text-decoration-color: initial;\"\u003e\u003cbr\u003e\u003c/h3\u003e\u003ch3\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u003cstrong\u003e\u003cspan style=\"font-size: 18px;\"\u003e매치메이킹 개선\u003c/span\u003e\u003c/strong\u003e\u003c/span\u003e\u003c/h3\u003e\u003cul\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e아시아 서버 미스릴 큐가 세분화 되며, 최상위 큐가 랭크 포인트 8600점 이상으로 제한됩니다.\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u003cbr\u003e\u003c/span\u003e\u003c/p\u003e\u003ch5 class=\"er-point-title\"\u003e특성\u003c/h5\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u003cstrong\u003e혼돈\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e벽력\u003c/span\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e피해량 30(+레벨*2)(+추가 공격력의 45% 혹은 스킬 증폭의 26%) → 30(+레벨*2)\u003cstrong\u003e(+추가 공격력의 65%\u003c/strong\u003e 혹은 스킬 증폭의 26%)\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e와류\u003c/span\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e체력 회복량 (+추가 공격력의 70%)(+스킬 증폭의 20%)(+최대 체력의 7%)(+잃은 체력의 10%) → (+추가 공격력의 70%)(+스킬 증폭의 20%)\u003cstrong\u003e(+최대 체력의 8%)\u003c/strong\u003e(+잃은 체력의 10%)\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u003cbr\u003e\u003c/span\u003e\u003c/p\u003e\u003ch5 class=\"er-point-title\"\u003e무기 스킬\u003c/h5\u003e\u003cul\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e도끼 - 피의 나선(D)\u003c/span\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e피해량 50/75/100(+추가 공격력의 50/65/80%)(+스킬 증폭의 25%)(+대상 최대 체력의 6%) → 50/75/100(+추가 공격력의 50/65/80%)\u003cstrong\u003e(+스킬 증폭의 30%)\u003c/strong\u003e(+대상 최대 체력의 6%)\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e아르카나 - VF 매개(D)\u003c/span\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e피해량 20/40/60(+스킬 증폭의 18%)\u003cstrong\u003e\u0026nbsp;\u003c/strong\u003e→\u003cstrong\u003e\u0026nbsp;\u003c/strong\u003e20/40/60\u003cstrong\u003e(+스킬 증폭의 20%)\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u003cbr\u003e\u003c/span\u003e\u003c/p\u003e\u003ch5 class=\"er-point-title\"\u003e실험체\u003c/h5\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u003cstrong\u003e니아\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u003cstrong\u003eE - 1UP\u003c/strong\u003e의 이동 속도 증가 효과 지속시간이 의도보다 짧게 적용되고 있던 문제가 수정됩니다.\u003c/span\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e1UP(E)\u003c/span\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e이동 속도 증가 지속 시간이 의도와 다르게 적용되고 있던 문제 수정\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e이동 속도 증가 지속 시간 1초 → \u003cstrong\u003e2초\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u0026nbsp;\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u003cstrong\u003e니키\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e니키는 \u003cstrong\u003eR - 분노의 어퍼컷!\u003c/strong\u003e을 활용한 아군과의 스킬 연계에서 매우 뛰어난 모습을 보이고 있습니다. 특히 교전 시작과 동시에 궁극기를 바로 사용하는 플레이를 견제하고자 해당 스킬의 기본 피해량을 낮춥니다.\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e추가로 \u003cstrong\u003eW - 가드\u0026amp;카운터\u003c/strong\u003e 적중 시 적에게 적용되는 이동 속도 감소 효과가 시간에 걸쳐 점차 회복되지 않던 문제를 수정합니다.\u003c/span\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e가드\u0026amp;카운터(W)\u003c/span\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e이동 속도 감소 효과가 지속 시간에 걸쳐 회복되지 않는 문제 수정\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e분노의 어퍼컷!(R)\u003c/span\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e피해량 100/180/260(+스킬 증폭의 35%) → \u003cstrong\u003e80/155/230\u003c/strong\u003e(+스킬 증폭의 35%)\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u0026nbsp;\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u003cstrong\u003e다니엘\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e다니엘이 치명타 아이템 빌드를 채용했을 때 보여주는 강력한 피해 능력을 견제하고자 무기 숙련도의 기본 공격 증폭 효과를 하향합니다.\u003c/span\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e단검 무기 숙련도 레벨 당 기본 공격 증폭 2.2% → \u003cstrong\u003e2.1%\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u0026nbsp;\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u003cstrong\u003e레녹스\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e레녹스는 뛰어난 저지 능력을 바탕으로 높은 승률을 기록하고 있습니다. \u003cstrong\u003eE - 휩쓸기\u003c/strong\u003e의 이동 속도 감소 지속 시간을 줄여 저지력을 하향 조정합니다.\u003c/span\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e휩쓸기(E)\u003c/span\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e이동 속도 감소 지속 시간 1.25초 → \u003cstrong\u003e1초\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u0026nbsp;\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u003cstrong\u003e루크\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e루크는 다소 낮은 평균 피해량을 보여주고 있습니다.\u003cstrong\u003e\u0026nbsp;R - 애프터 서비스\u003c/strong\u003e의 표식 피해량을 상향하여 부족한 위력을 보완합니다.\u003c/span\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e애프터 서비스(R)\u003c/span\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e표식 피해량 20/45/70(+공격력의 13%)(+대상 최대 체력의 2%) → 20/45/70\u003cstrong\u003e(+공격력의 15%)\u003c/strong\u003e(+대상 최대 체력의 2%)\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u0026nbsp;\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u003cstrong\u003e리오\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e리오는 매우 뛰어난 거리 조절 능력을 보여주고 있습니다. 단궁 상태에서의 \u003cstrong\u003eW - 하나레\u003c/strong\u003e 이동 속도 감소 효과와 \u003cstrong\u003eR - 연사\u003c/strong\u003e의 벽 충돌 기절 지속 시간을 줄여 과도한 거리 조절 능력을 견제합니다.\u003c/span\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e하나레(W)\u003c/span\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e단궁\u003c/span\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e이동 속도 감소 30% → \u003cstrong\u003e25%\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003c/li\u003e\u003c/ul\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e연사/정사필중(R)\u003c/span\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e연사(단궁)\u003c/span\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e벽 충돌 시 기절 지속 시간 1.2초 →\u003cstrong\u003e\u0026nbsp;1초\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003c/li\u003e\u003c/ul\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u0026nbsp;\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u003cstrong\u003e마커스\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u003cstrong\u003eR - 지각변동\u003c/strong\u003e의 이동 속도 감소 효과 지속시간이 의도보다 짧게 적용되고 있던 문제가 수정됩니다.\u003c/span\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e지각변동(R)\u003c/span\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e이동 속도 감소 지속 시간이 의도와 다르게 적용되고 있던 문제 수정\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e이동 속도 감소 지속 시간 1초 → \u003cstrong\u003e1.5초\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u0026nbsp;\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u003cstrong\u003e매그너스\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e매그너스가 \u003cstrong\u003eE - 강타\u003c/strong\u003e로 상대를 벽에 충돌시켰을 때의 위력을 강화하여 어려운 플레이에 대한 리턴을 높여줍니다.\u003c/span\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e강타(E)\u003c/span\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e벽 충돌 피해량 20/40/60/80/100(+추가 공격력의 30%)(+스킬 증폭의 30%)(+대상 최대 체력의 7%) → 20/40/60/80/100\u003cstrong\u003e(+추가 공격력의 40%)(+스킬 증폭의 35%)(+대상 최대 체력의 8%)\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u0026nbsp;\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u003cstrong\u003e바바라\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e상대적으로 활용도가 낮은 \u003cstrong\u003eRW - 초고출력 이온레이저\u003c/strong\u003e의 위력을 상향하여, 특정 상황에서 선택지로 고려될 수 있도록 합니다.\u003c/span\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e오버클럭(R)\u003c/span\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e초고출력 이온 레이저(RW) 피해량 200/250/300(+스킬 증폭의 85%)(+대상 최대 체력의 20%) → 200/\u003cstrong\u003e300/400\u003c/strong\u003e(+스킬 증폭의 85%)(+대상 최대 체력의 20%)\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e초고출력 이온 레이저(RW) 적중 시 이동 속도 증가 40% →\u003cstrong\u003e\u0026nbsp;50%\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u0026nbsp;\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u003cstrong\u003e블레어\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e블레어의 지나치게 낮은 기본 내구도를 상향하여 교전 안정성을 보완합니다.\u003c/span\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e기본 방어력 47 → \u003cstrong\u003e50\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u0026nbsp;\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u003cstrong\u003e비형\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e비형은 높은 선택률과 함께 강력한 교전 능력을 보여주고 있습니다. \u003cstrong\u003eR - 신명나게 놀아보자!\u003c/strong\u003e의 기본 피해량을 낮춰 과도한 위력을 덜어냅니다.\u003c/span\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e신명나게 놀아보자!(R)\u003c/span\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e피해량 150/300/450(+추가 공격력의 170%)(+대상 최대 체력의 10%) → \u003cstrong\u003e120/270/420\u003c/strong\u003e(+추가 공격력의 170%)(+대상 최대 체력의 10%)\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u0026nbsp;\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u003cstrong\u003e샬럿\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e샬럿은 상위 구간에서 지나치게 높은 승률을 유지하고 있습니다. 내구도를 한 차례 더 하향하여 교전 안정성을 견제하고, 무기 숙련도 효과를 낮춰 전반적인 성능을 하향 조정합니다.\u003c/span\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e아르카나 무기 숙련도 레벨 당 스킬 증폭 4.4% → \u003cstrong\u003e4.3%\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e레벨 당 방어력 2.9 → \u003cstrong\u003e2.6\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u0026nbsp;\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u003cstrong\u003e수아\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e수아는 매우 높은 점수 획득량을 기록하고 있습니다. \u003cstrong\u003eW - 파랑새\u003c/strong\u003e의 보호막량을 줄여 특정 조합을 상대할 때 발휘하는 지나친 교전 성능을 하향 조정합니다.\u003c/span\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e파랑새(W)\u003c/span\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e보호막량 80/110/140/170/200(+스킬 증폭의 40%) → 80/110/140/170/200\u003cstrong\u003e(+스킬 증폭의 35%)\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u0026nbsp;\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u003cstrong\u003e아드리아나\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e아드리아나는 대부분의 지표에서 뛰어난 수치를 유지하고 있습니다. 무기 숙련도 효과를 낮춰 전반적인 성능을 하향 조정하며, \u003cstrong\u003eR - 화염 난사\u003c/strong\u003e의 피해량을 줄여 원거리 견제 능력을 낮춥니다.\u003c/span\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e투척 무기 숙련도 레벨 당 스킬 증폭 4.1% → \u003cstrong\u003e4%\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e화염 난사(R)\u003c/span\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e피해량 140/170/200(+스킬 증폭의 40%) -\u0026gt; \u003cstrong\u003e130/155/180\u003c/strong\u003e(+스킬 증폭의 40%)\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u0026nbsp;\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u003cstrong\u003e아르다\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e아르다는 낮은 평균 피해량을 기록하고 있습니다.\u003cstrong\u003e\u0026nbsp;E - 님루드의 비석\u0026nbsp;\u003c/strong\u003e피해량을 상향하여 원거리 견제 능력을 강화합니다.\u003c/span\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e님루드의 비석(E)\u003c/span\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e피해량 80/110/140/170/200(+스킬 증폭의 60%) → 80/110/140/170/200\u003cstrong\u003e(+스킬 증폭의 65%)\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e님루드의 문(RE)도 적용됩니다.\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003c/li\u003e\u003c/ul\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u0026nbsp;\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u003cstrong\u003e아야\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e아야는 상위 구간에서 부족한 성능을 보여주고 있으며, 특히 돌격 소총 아야는 대부분의 구간에서 어려움을 겪고 있습니다. \u003cstrong\u003eQ - 2연발\u003c/strong\u003e과 \u003cstrong\u003eW - 고정사격\u003c/strong\u003e의 공격력 계수를 상향하여 스킬 활용도를 개선합니다.\u003c/span\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e2연발(Q)\u003c/span\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e1타 피해량 공격력의 100% * (기본 공격 증폭) → 공격력의 \u003cstrong\u003e110%\u003c/strong\u003e * (기본 공격 증폭)\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e고정 사격(W)\u003c/span\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e피해량 30/40/50/60/70(+공격력의 50%)(+스킬 증폭의 30/35/40/45/50%) → 30/40/50/60/70\u003cstrong\u003e(+공격력의 55%)\u003c/strong\u003e(+스킬 증폭의 30/35/40/45/50%)\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u0026nbsp;\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u003cstrong\u003e아이솔\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u003cstrong\u003eP - 유격전\u003c/strong\u003e의 맞춤형 능력치 증가량을 상향하여 교전 위력을 보강합니다.\u003c/span\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e유격전(P)\u003c/span\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e맞춤형 능력치 증가 8/13/18 → \u003cstrong\u003e10/15/20\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u0026nbsp;\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u003cstrong\u003e얀\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e얀은 지속적인 약세를 보이고 있습니다. 교전에서 다시 뛰어난 위력을 발휘할 수 있도록 \u003cstrong\u003eQ - 니 스트라이크\u003c/strong\u003e의 강화 시 방어력 감소량을 이전 수치로 되돌려줍니다.\u003c/span\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e니 스트라이크(Q)\u003c/span\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e강화 시 방어력 감소량 15% → \u003cstrong\u003e20%\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u0026nbsp;\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u003cstrong\u003e엘레나\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e엘레나는 피해 능력이 지나치게 감소한 모습을 보이고 있습니다.\u003cstrong\u003e\u0026nbsp;Q - 크리스탈 엘레강스\u003c/strong\u003e의 스킬 증폭 및 추가 체력 계수를 상향하여 부족해진 화력을 보완합니다.\u003c/span\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e크리스탈 엘레강스(Q)\u003c/span\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e1타 피해량 20/35/50/65/80(+스킬 증폭의 25%)(+추가 체력의 10%) → 20/35/50/65/80\u003cstrong\u003e(+스킬 증폭의 35%)\u003c/strong\u003e(+추가 체력의 10%)\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e2타 피해량 40/70/100/130/160(+스킬 증폭의 35%)(+추가 체력의 10%) → 40/70 255, 255, 255);\"\u003e\u003cstrong\u003e펜리르\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e펜리르는 전반적인 지표가 부진한 상태입니다. \u003cstrong\u003eQ - 찢는 손톱\u003c/strong\u003e의 강화 시 체력 회복량을 높여 교전 중 유지력을 보강합니다.\u003c/span\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e찢는 손톱(Q)\u003c/span\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e체력 회복량 40/65/90/115/140(+공격력의 60%) → \u003cstrong\u003e50/80/110/140/170\u003c/strong\u003e(+공격력의 60%)\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u0026nbsp;\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u003cstrong\u003e프리야\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e프리야는 낮은 점수 획득량을 기록하고 있습니다. 기타 무기 숙련도 효과를 상향하여 전반적인 성능을 개선합니다.\u003c/span\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e기타 무기 숙련도 레벨 당\u003c/span\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e스킬 증폭 4.3% → \u003cstrong\u003e4.4%\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e공격 속도 2% → \u003cstrong\u003e2.8%\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u0026nbsp;\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u003cstrong\u003e피오라\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u003cstrong\u003eP - 뚜셰\u003c/strong\u003e의 이동 속도 증가 효과 지속시간이 의도보다 짧게 적용되고 있던 문제가 수정됩니다.\u003c/span\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e뚜셰(P)\u003c/span\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e이동 속도 증가 지속 시간이 의도와 다르게 적용되고 있던 문제 수정\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e이동 속도 증가 지속 시간 1.5초 → \u003cstrong\u003e2초\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u0026nbsp;\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u003cstrong\u003e하트\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e하트는 낮은 평균 피해량을 기록하고 있습니다.\u003cstrong\u003e\u0026nbsp;W - Overdrive\u003c/strong\u003e를 사용했을 때 보다 확실한 피해 능력을 발휘할 수 있도록 공격력 증가량을 상향 조정합니다.\u003c/span\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003eOverdrive(W)\u003c/span\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e공격력 증가 5/10/15/20/25 → \u003cstrong\u003e6/12/18/24/30\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u0026nbsp;\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u003cstrong\u003e현우\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e현우는 대부분의 구간에서 낮은 지표를 기록하고 있습니다. \u003cstrong\u003eQ - 발 밟기\u003c/strong\u003e의 낮은 레벨 피해량과 재사용 대기시간을 상향 조정하여 초반 및 성장 단계에서의 교전 능력을 보완합니다.\u003c/span\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e발 밟기(Q)\u003c/span\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e피해량 50/100/150/200/250(+추가 공격력의 60%)(+스킬 증폭의 85%) → \u003cstrong\u003e90/130/170/210\u003c/strong\u003e/250(+추가 공격력의 60%)(+스킬 증폭의 85%)\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e쿨다운 9/8/7/6/5초 → \u003cstrong\u003e7/6.5/6/5.5/5초\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u0026nbsp;\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u003cstrong\u003e혜진\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e혜진은 평균 피해량이 낮아진 모습을 보이고 있습니다.\u003cstrong\u003e\u0026nbsp;P - 삼재\u003c/strong\u003e의 스킬 증폭 계수를 상향하여 스킬 연계를 통한 피해 능력을 보완합니다.\u003c/span\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e삼재(P)\u003c/span\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e피해량 스킬 증폭의 10/15/20% → \u003cstrong\u003e15/20/25%\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u0026nbsp;\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u003cstrong\u003e히스이\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e히스이는 대부분의 지표가 하락하며 약세를 이어가고 있습니다. \u003cstrong\u003eQ - 쾌연격\u003c/strong\u003e의 피해량을 높여 교전 위력을 보완합니다.\u003c/span\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb n\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e게임 진입 시 배경이 검은색으로 출력되는 문제의 의심 코드 수정\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e일부 리플레이 진입이 불가능한 문제 수정\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e시작 아이템 배치 순서가 루트 생성 시 등록 순서에 맞춰 출력되는 문제 수정\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e특정 상황에서 부활 지역 선택맵이 정상적으로 출력되지 않는 문제 수정\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e특정 위치에서 프로토콜 위반 전술 스킬 이펙트가 잘못 출력되는 문제 수정\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e보호막에 입힌 피해 텍스트가 모든 플레이어 기준으로 표시되는 문제 수정\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e카메라 잠금 사용 시 카메라 높이가 변경될 때 부자연스럽게 출력되는 문제 수정\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e야생동물 오버레이가 플레이어 화면에서 지속적으로 출력되는 문제의 의심 코드 수정\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e특정 상황에서 획득한 아이템이 인벤토리에 반영되지 않는 문제 수정\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e사과 나무 오버레이 타이머가 재생성 시간과 일치하지 않는 문제 수정\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003eP5R 괴도단 마크 드론 스킨 이펙트가 잘못 출력되는 문제 수정\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003eAI 봇이 크로노 스피어 방향으로 이동하지 않는 문제 수정\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e튜토리얼 3장에서 야생 동물 처치 안내 내비게이션이 출력되지 않는 문제 수정\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e코발트 프로토콜에서 힐 팩 상태가 미니맵에 갱신되지 않는 문제 수정\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e코발트 프로토콜 특정 상황에서 인퓨전을 다중으로 선택할 수 있는 문제 수정\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u003cbr\u003e\u003c/span\u003e\u003c/p\u003e\u003ch3\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u003cstrong\u003e\u003cspan style=\"font-size: 18px;\"\u003e실험체 및 무기 개선 사항\u003c/span\u003e\u003c/strong\u003e\u003c/span\u003e\u003c/h3\u003e\u003cul\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e특정 상황에서 실험체 외형 일부가 고정된 상태로 출력되는 문제 수정\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e일부 실험체 스킬 확장 툴팁에서 수치가 잘못 출력되는 문제 수정\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e일부 캐릭터 실험체 상세 페이지에서 보이스에 스킨 표시가 잘못 출력되는 문제 수정\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e일부 실험체 빈사 후 사망 시 보이스가 잘못 출력되는 문제 수정\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e일부 실험체 빈사 후 사망 시 빈사 연출이 중복 출력되는 문제 수정\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e양손검 무기 스킬 빗겨 흘리기(D) 피해가 모션 및 이펙트보다 빨리 적용되는 문제 수정\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u003cstrong\u003e니키\u003c/strong\u003e 스킬 미리 보기 영상에서 기본 공격 애니메이션이 잘못 출력되는 문제 수정\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e치어풀 펀치! \u003cstrong\u003e니키\u003c/strong\u003e 스킨 착용 중 보관함에서 외형이 잘못 출력되는 문제 수정\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e치어풀 펀치! \u003cstrong\u003e니키\u003c/strong\u003e 스킨 착용 중 무기 장착 해제 상태에서 애니메이션이 어색하게 출력되는 문제 수정\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u003cstrong\u003e레녹스\u003c/strong\u003e 위풍당당(P) 미리보기 영상에서 잘못된 아이템이 표시되는 문제 수정\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u003cstrong\u003e루치아\u003c/strong\u003e와 \u003cstrong\u003e세레스\u003c/strong\u003e가 서로를 구출할 때 전용 대사가 출력되도록 추가\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e그레이스 녹턴 \u003cstrong\u003e르노어\u003c/strong\u003e 스킨 착용 중 바이올린 활 색상이 출력되지 않는 문제 수정\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u003cstrong\u003e리 다이린\u003c/strong\u003e 관찰일지 분석 개요의 연구원 직책이 잘못 표시된 문제 수정\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e3rd Anniversary \u003cstrong\u003e리오\u003c/strong\u003e 스킨(Dolce 포함) 착용 중 활 무기 스킬 곡사(D) 사용 시 시전 이펙트가 어색한 위치에 력되는 현상 수정\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u003cstrong\u003e블레어\u003c/strong\u003e XMS-5 활성화(R) 탐지된 실험체 방향 이펙트가 어색하게 출력되는 문제 수정\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e전학생 \u003cstrong\u003e샬럿\u003c/strong\u003e 스킨 착용 중 기적 실현(R) 스킬 바닥 이펙트가 어색하게 출력되는 문제 수정\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u003cstrong\u003e셀린\u003c/strong\u003e 일부 스킨 착용 중 손에 든 폭탄 크기가 기본 스킨 대비 작게 출력되는 문제 수정\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u003cstrong\u003e셀린\u003c/strong\u003e 체력바에 구분선이 출력되는 문제 수정\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u003cstrong\u003e쇼우\u003c/strong\u003e 요리사의 열정(P) 툴팁에서 음료 및 고급 등급 음식 관련 내용이 출력되는 문제 수정\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u003cstrong\u003e위드리아나\u003c/strong\u003e 스킨 착용 중 휴식 시 일부 이펙트 연출이 비정상적으로 출력되는 문제 수정\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u003cstrong\u003e알렉스\u003c/strong\u003e 일부 스킨 착용 중 휴식 시 게임기에 연출이 출력되지 않는 문제 수정\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u003cstrong\u003e에스텔\u003c/strong\u003e 로비 애니메이션 등장 시 화재 이펙트가 어색하게 출력되는 문제 수정\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e소방기동대 \u003cstrong\u003e에스텔\u003c/strong\u003e 스킨 로비 애니메이션에서 화재 이펙트가 넓게 출력되는 문제 수정\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u003cstrong\u003e에키온\u003c/strong\u003e 뒤집힌 비늘(W) 툴팁에서 보호막 지속 시간이 출력되지 않는 문제 수정\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u003cstrong\u003e에키온\u003c/strong\u003e 독사의 진노(R) 환경 오브젝트에 적중 시 VF폭주 지속 시간이 연장되는 문제 수정\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u003cstrong\u003e에키온\u003c/strong\u003e 카드모스의 부름[데스애더](P) 툴팁에서 전투광 버프 최대 중첩 내용이 출력되지 않는 문제 수정\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u003cstrong\u003e유스티나\u003c/strong\u003e 아스트라 버스트!(R) 투사체 궤적 이펙트가 어색하게 출력되는 문제 수정\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u003cstrong\u003e이슈트반\u003c/strong\u003e 강화 스킬(Q, W, E) 사용 시 사거리 인디케이터가 표시되도록 개선\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u003cstrong\u003e일레븐\u003c/strong\u003e 다 덤벼보라구!(R) 상태 아이콘 툴팁에서 스킬 효과 일부가 출력되지 않는 문제 수정\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e청랑일섬 \u003cstrong\u003e츠바메\u003c/strong\u003e 스킨 로비 애니메이션에서 선글라스 렌즈가 출력되지 않는 문제 수정\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e해변의 인형사 \u003cstrong\u003e클로에\u003c/strong\u003e 스킨 착용 중 빈사 애니메이션이 어색하게 출력되는 문제 수정\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e싱어송라이터 \u003cstrong\u003e프리야\u0026nbsp;\u003c/strong\u003e스킨 로비 애니메이션에서 상의 부분이 잘못 출력되는 문제 수정\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u003cstrong\u003e프리야\u003c/strong\u003e 프리비티의 노래(E) 3회 적중 시 이펙트가 어색한 위치에 출력되는 문제 수정\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u003cbr\u003e\u003c/span\u003e\u003c/p\u003e\u003ch3\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u003cstrong\u003e\u003cspan style=\"font-size: 18px;\"\u003e로비 개선 사항\u003c/span\u003e\u003c/strong\u003e\u003c/span\u003e\u003c/h3\u003e\u003cul\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e매칭 중에도 제작소에서 아이템 분해 및 제작이 가능하도록 개선\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e제작소의 보유한 아이템 자동 분해 설정이 계정별로 저장되고, 자동 분해를 켤 때 출력되는 안내 팝업에 \"다시 보지 않기\" 체크 박스 추가\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e제작소 교환소의 박스 상품에서도 상점과 동일하게 보상 목록을 확인할 수 있도록 개선하고, 픽업 이벤트 남은 기간 표기 위치 조정\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e마우스 커서 크기에 따라 커서를 따라다니는 툴팁이 커서에 가려지는 문제 개선\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e시즌 팩 스페셜 오퍼 연출에 효과음 추가\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e이스포츠 이모티콘 등 일부 이모티콘이 관련 실험체 이름으로 검색되도록 개선\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003eBGM Red Heart의 아티스트 표기를 NAYUBI로 수정\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e개인정보처리방침 개정에 따라 게임 실행 시 약관 재동의 팝업이 출력되며, 청약철회 필수 고지사항 링크 최신화\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e보름달 올클리어 박스 개봉 수량이 부족한 경우 개봉 불가로 표시되지 않는 문제 수정\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e도감 탭에서 특수 재료의 획득 경로가 출력되지 않는 문제 수정\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e특정 상황에서 루트 편집 시 후반 아이템 리스트가 출력되지 않는 문제 수정\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e게임 준비 단계 이후 로딩 화면이 나오기 전에 로비 화면이 출력되는 문제 수정\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e게임 결과 연출 건너뛰기 옵션이 동작하지 않는 문제 수정\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e일반 컬렉션 필터 항목이 잘못 출력되는 문제 수정\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e사용자 설정 대전 필터 항목이 잘못 출력되는 문제 수정\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e실험체 및 스킨 선택권 사용 시 개봉 버튼에 선택권 개수가 갱신되지 않는 문제 수정\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e일부 해상도에서 설정 화면 하단 버튼이 UI와 겹쳐서 출력되는 문제 수정\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e미션 목록에서 다른 미션 탭을 선택해도 이전에 선택한 탭의 하이라이트가 해제되지 않는 문제 수정\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e아카이브 에피소드의 마우스 스크롤 조작이 반대로 적용되어 있는 문제 수정\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e코발트 프로토콜 3레벨 인퓨전 구매하기 미션이 일부 인퓨전 구매 시 클리어되지 않는 문제 수정\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\n            \u003c/div\u003e","date":"2026-09-30T08:00:00.000000Z","thumb":"https://cdn.playeternalreturn.com/upload/2026/09/30/xSCGclsC1x3E5VTGYfa4GvcAwLnz9J6lWmMrNdhA.png","title":"2026.10.01 - 12.5 패치노트","url":"https://playeternalreturn.com/posts/news/3867"},{"id":3850,"updated":"2026-10-30T01:28:46.000000Z","html":"\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e12.4a 핫픽스가 15시 00분에 적용될 예정입니다.\u003c/span\u003e\u003cbr\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e단, 빌드 소요 시간에 따라 최대 30분 정도의 오차가 있을 수 있습니다.\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e※이 핫픽스는 클라이언트 업데이트가 필요합니다. 게임을 종료하고 업데이트를 받아주세요.\u003cbr\u003e※연습 모드 및 툴팁에는 일부 수정 사항이 적용되지  개인 상점 아이템 리스트 및 확률이 변경됩니다.\u003c/span\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u003cstrong\u003e박스 획득 구성품 및 확률 변경\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e스킨 데이터 박스, 연구소 데이터 박스 등 박스를 통해 획득하는 구성품 및 확률이 변경됩니다.\u003cbr\u003e변경되는 구성품 및 확률은 공식 홈페이지 [\u003ca href=\"https://playeternalreturn.com/stats/4\"\u003e\u003cu\u003e박스 예정 확률\u003c/u\u003e\u003c/a\u003e]에서 확인할 수 있습니다.\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u003cstrong\u003e분해 획득 구성품 및 확률 변경\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e도안 아이템, 온전한 아이템 분해 시 획득 구성품 및 확률이 변경됩니다.\u003cbr\u003e변경되는 구성품 및 확률은 공식 홈페이지 [\u003ca href=\"https://playeternalreturn.com/stats/5\"\u003e\u003cu\u003e분해 예정 확률\u003c/u\u003e\u003c/a\u003e]에서 확인할 수 있습니다.\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u003cstrong\u003e개인 상점 구성품 및 확률 변경\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e개인 상점 내 배치되는 상품 구성품(1번 구간, 2번 구간) 및 확률이 변경됩니다.\u003cbr\u003e변경되는 구성품 및 확률은 공식 홈페이지 [\u003ca href=\"https://playeternalreturn.com/stats/9\"\u003e\u003cu\u003e개인 상점 예정 확률\u003c/u\u003e\u003c/a\u003e]에서 확인할 수 있습니다.\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u003cem\u003e※ 예정 확률은 9월 17일 (목) 현재 확률로 적용됩니다.\u003c/em\u003e\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u003cbr\u003e\u003c/span\u003e\u003c/p\u003e\u003ch3\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u003cstrong\u003e\u003cspan style=\"font-size: 18px;\"\u003e시즌 12 이스포츠 \u0026amp; 팀 서포트 패키지\u003c/span\u003e\u003c/strong\u003e\u003c/span\u003e\u003c/h3\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e이스포츠 서포트 패키지와 KEL(Korea Esports League) 팀들이 제작한 팀 서포트 패키지가 출시됩니다.\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e이터널 리턴 이스포츠와 KEL 팀들을 응원해주세요!\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cimg src=\"https://cdn.playeternalreturn.com/2026%2F09%2F16%2F1789537845692-03.+esports+support.png\" class=\"fr-fil fr-dib fr-draggable\"\u003e\u003c/p\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u003cstrong\u003e이스포츠 서포트 패키지의 판매 순수익은 전액 이터널 리턴 이스포츠 발전을 위해 사용하게 됩니다.\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e판매 가격: 9,900원 (계정 당 1회 구매 가능)\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e구성품\u003c/span\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e[벽파참랑 슈린 으아앙 이모티콘] (시즌12 이스포츠 동적 이모티콘)\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e스킨 데이터 박스 1개 / 박스키 1개 / 연구소 데이터 박스 1개 / 400 NP (무료) / XP·A-Coin·ER Point 부스트(3일)\u003c/span\u003e\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cspan style=\"color: rgb(255, 255, 255);\"\u003e\u003cstrong\u003e팀 서포트 패키지의 순수익은 전액 해당 이스포츠 팀에게 돌아갑니다.\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cstrong\u003e\u003cbr\u003e\u003c/strong\u003e\u003c/p\u003e\u003cp\u003e\u003cstrong\u003e\u003cimg src=\"https://cdn.playeternalreturn.com/2026%2F09%2F16%2F1789537859730-04.+16%EC%A2%85+%ED%95%A9%EB%B3%B8.jpg\" class=\"fr-fil fr-di
