name: Update patch notes

on:
  schedule:
    - cron: '*/30 * * * *'   # 30분마다 (GitHub 사정으로 몇 분 늦을 수 있음)
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['viewer/**', 'collect.ps1', '.github/workflows/update.yml']

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Collect patch notes
        shell: pwsh
        run: ./collect.ps1

      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data index.html
          if git diff --cached --quiet; then
            echo "변경 없음"
          else
            git commit -m "Update patch notes"
            git pull --rebase
            git push
          fi

      - name: Build site
        run: |
          mkdir _site
          cp index.html _site/index.html

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deploy
        uses: actions/deploy-pages@v4
